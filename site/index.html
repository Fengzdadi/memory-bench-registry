    showing: (n, total) => `${n} / ${total}`, clear: "清除筛选", emptyTitle: "没有符合条件的 benchmark。",
    hName: "名称", hDate: "日期", hTypes: "记忆类型", hConv: "对话", hQ: "题", hRepro: "可复现等级", hLinks: "链接",
    conv: "对话", q: "题", paper: "论文", code: "代码", data: "数据", yaml: "YAML", none: "无", close: "关闭",
    dConv: "对话数", dQ: "题目数", dCtx: "平均上下文长度", dJudge: "Judge 模型", dRepro: "可复现等级",
    checked: d => `核对于 ${d}`, dTypes: "记忆类型", dScale: "规模数字的说明", dMetrics: "评测指标", dNotes: "备注",
    dSources: n => `出处（${n} 个字段）`, dRuns: "我们的运行记录",
    runDate: "日期", runModel: "模型", runSample: "样本", runTokens: "Tokens", runCost: "费用", runNotes: "备注",
    foot: repo => `数据：CC BY 4.0，也可直接下载 <a href="benchmarks.json">benchmarks.json</a>。代码：MIT。所链接的论文、代码和数据集沿用各自的许可证。缺了某个 benchmark？<a href="${repo}#contributing" target="_blank" rel="noopener">提交一条</a>。`,
  },
};

let lang = "en";
try { const s = localStorage.getItem("lang"); lang = s === "zh" || s === "en" ? s : (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en"; } catch (e) {}
const t = (k, ...a) => { const v = UI[lang][k]; return typeof v === "function" ? v(...a) : v; };
const typeDesc  = k => TYPE_DESC[k]?.[lang === "zh" ? 1 : 0] ?? "";
const levelDesc = k => LEVEL_DESC[k]?.[lang === "zh" ? 1 : 0] ?? "";

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const safeUrl = u => (typeof u === "string" && /^https?:\/\//i.test(u)) ? u : null;
const fmtNum = n => Number(n).toLocaleString("en-US");
const linkify = s => esc(s).replace(/https?:\/\/[^\s<>"')\]]*[^\s<>"').,;:\]]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const $ = id => document.getElementById(id);
const tokens = q => q.toLowerCase().split(/\s+/).filter(Boolean);

for (const e of ENTRIES) {
  e._year = e.release_date ? e.release_date.slice(0, 4) : "undated";
  e._name = e.name.toLowerCase();
  e._hay = [e.name, e.slug, e.venue, e.memory_types.join(" "), e.metrics.join(" "), e.judge_model, e.notes, e.scale.notes, e.scale.avg_context_length]
    .filter(Boolean).join("\n").toLowerCase();
}
const FLAGS = {
  code:  { label: "flagCode",  test: e => !!e.links.code },
  data:  { label: "flagData",  test: e => !!e.links.data },
  judge: { label: "flagJudge", test: e => !!e.judge_model },
  peer:  { label: "flagPeer",  test: e => !!e.venue && e.venue !== "arXiv preprint" },
};
const YEARS = [...new Set(ENTRIES.map(e => e._year))].sort().reverse();
const LEVELS = DATA.levels.filter(l => ENTRIES.some(e => e.repro_level === l));
const FACETS = [
  { key: "types",  name: "fType",  values: () => DATA.types, desc: typeDesc,  has: (e, v) => e.memory_types.includes(v) },
  { key: "levels", name: "fLevel", values: () => LEVELS,     desc: levelDesc, has: (e, v) => e.repro_level === v },
  { key: "years",  name: "fYear",  values: () => YEARS,      desc: () => "",  has: (e, v) => e._year === v },
];

/* ---------------- state (mirrored in the query string) ---------------- */
const SORT_KEYS = {
  date: { get: e => e.release_date, first: "desc" },
  name: { get: e => e.name, first: "asc" },
  conv: { get: e => e.scale.conversations, first: "desc" },
  q:    { get: e => e.scale.questions, first: "desc" },
};
const DEFAULT_SORT = "date:desc";
let visibleSlugs = []; // slugs in the order currently shown in the table, for prev / next in the detail panel
const state = { q: "", types: new Set(), levels: new Set(), years: new Set(), flags: new Set(), sort: DEFAULT_SORT };

function readURL() {
  const p = new URLSearchParams(location.search);
  const list = (k, ok) => (p.get(k) || "").split(",").filter(v => ok.includes(v));
  state.q = p.get("q") || "";
  state.types = new Set(list("type", DATA.types));
  state.levels = new Set(list("level", DATA.levels));
  state.years = new Set(list("year", YEARS));
  state.flags = new Set(list("has", Object.keys(FLAGS)));
  const [key, dir] = (p.get("sort") || "").split(":");
  state.sort = Object.hasOwn(SORT_KEYS, key) && (dir === "asc" || dir === "desc") ? `${key}:${dir}` : DEFAULT_SORT;
}
function writeURL() {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.types.size) p.set("type", [...state.types].join(","));
  if (state.levels.size) p.set("level", [...state.levels].join(","));
  if (state.years.size) p.set("year", [...state.years].join(","));
  if (state.flags.size) p.set("has", [...state.flags].join(","));
  if (state.sort !== DEFAULT_SORT) p.set("sort", state.sort);
  const qs = p.toString();
  history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
}

/* ---------------- filtering and sorting ---------------- */
// `skip` leaves one facet out so its own counts show what selecting an option would give.
function matches(e, skip) {
  if (state.q) for (const tok of tokens(state.q)) if (!e._hay.includes(tok)) return false;
  if (skip !== "types"  && state.types.size  && !e.memory_types.some(v => state.types.has(v))) return false;
  if (skip !== "levels" && state.levels.size && !state.levels.has(e.repro_level)) return false;
  if (skip !== "years"  && state.years.size  && !state.years.has(e._year)) return false;
  for (const f of state.flags) if (!FLAGS[f].test(e)) return false;
  return true;
}
function sorted(rows) {
  const [key, dir] = state.sort.split(":"), get = SORT_KEYS[key].get, sign = dir === "asc" ? 1 : -1;
  return rows.sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null || y == null) return x == null && y == null ? a.name.localeCompare(b.name) : x == null ? 1 : -1; // missing values stay last
    const c = typeof x === "string" ? x.localeCompare(y, undefined, { sensitivity: "base" }) : x - y;
    return c ? c * sign : a.name.localeCompare(b.name);
  });
}
function visibleEntries() {
  const rows = sorted(ENTRIES.filter(e => matches(e)));
  if (!state.q || state.sort !== DEFAULT_SORT) return rows;
  // With a search term and the default order, benchmarks whose name matches come before ones that only mention it in their notes.
  const toks = tokens(state.q), hit = e => toks.every(tok => e._name.includes(tok));
  return [...rows.filter(hit), ...rows.filter(e => !hit(e))];
}

/* ---------------- rendering: static pieces ---------------- */
function renderTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("theme").textContent = t(dark ? "themeLight" : "themeDark");
}
function renderStatic() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-attr]").forEach(el => {
    const [attr, key] = el.dataset.i18nAttr.split(":"); el.setAttribute(attr, t(key));
  });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("gh").href = DATA.repo;
  const checked = ENTRIES.map(e => e.repro_checked_at).filter(Boolean).sort().at(-1) || "—";
  $("intro").innerHTML = t("intro", ENTRIES.length, checked, `${DATA.repo}/blob/main/docs/fields.md`, `${DATA.repo}/blob/main/docs/excluded.md`);
  renderTheme();

  const heads = [["name", "hName", ""], ["date", "hDate", ""], [null, "hTypes", ""], ["conv", "hConv", "num", "tipConv"], ["q", "hQ", "num", "tipQ"], [null, "hRepro", ""], [null, "hLinks", ""]];
  $("thead").innerHTML = heads.map(([key, label, cls, tip]) => key
    ? `<th scope="col" class="${cls}" data-key="${key}"${tip ? ` title="${esc(t(tip))}"` : ""}><button type="button" class="sort-btn" data-sort="${key}">${esc(t(label))}</button></th>`
    : `<th scope="col" class="nosort">${esc(t(label))}</th>`).join("");

  $("foot").innerHTML = t("foot", DATA.repo);
  buildFilters();
}

/* ---------------- rendering: filters ---------------- */
function buildFilters() {
  const tog = (facet, v, label, title, plain) =>
    `<button type="button" class="tog${plain ? " plain" : ""}" aria-pressed="false" data-facet="${facet}" data-value="${esc(v)}"${title ? ` title="${esc(title)}"` : ""}><span>${esc(label)}</span><span class="n"></span></button>`;
  const defsPanel = (group, values, desc, note) => `<div class="facet-defs" id="defs-${group}" hidden><dl>${values.map(v => `<div><dt>${esc(v)}</dt><dd>${esc(desc(v))}</dd></div>`).join("")}</dl><p>${esc(t(note))}</p></div>`;
  const line = (group, name, hint, items, defs) => `<div class="facet"><div class="facet-name">${esc(t(name))}<small>${esc(t(hint))}</small>${defs ? `<button type="button" class="def-toggle" aria-expanded="false" aria-controls="defs-${group}">${esc(t("defsToggle"))}</button>` : ""}</div><div class="facet-items" data-group="${group}">${items}</div>${defs || ""}</div>`;
  $("filters").innerHTML =
    FACETS.map(f => line(f.key, f.name, "hintAny", f.values().map(v => tog(f.key, v, v === "undated" ? "—" : v, f.desc(v), false)).join(""),
      f.key === "types" ? defsPanel("types", DATA.types, typeDesc, "noteTypes") : f.key === "levels" ? defsPanel("levels", LEVELS, levelDesc, "noteLevels") : "")).join("") +
    line("flags", "fMore", "hintAll", Object.entries(FLAGS).map(([k, f]) => tog("flags", k, t(f.label), "", true)).join(""));
}
function updateFilters() {
  const root = $("filters");
  const paint = (facet, v, n, on) => {
    const b = root.querySelector(`[data-facet="${facet}"][data-value="${CSS.escape(v)}"]`);
    b.setAttribute("aria-pressed", String(on));
    b.classList.toggle("zero", n === 0 && !on);
    b.querySelector(".n").textContent = n;
  };
  for (const f of FACETS) for (const v of f.values())
    paint(f.key, v, ENTRIES.filter(e => matches(e, f.key) && f.has(e, v)).length, state[f.key].has(v));
  for (const k of Object.keys(FLAGS))
    paint("flags", k, ENTRIES.filter(e => matches(e) && FLAGS[k].test(e)).length, state.flags.has(k));
}

/* ---------------- rendering: table ---------------- */
function rowHTML(e) {
  const num = (cls, v, unit) => v == null ? `<td class="num ${cls} na muted">—</td>` : `<td class="num ${cls}" data-unit="${esc(unit)}">${fmtNum(v)}</td>`;
  const links = ["paper", "code", "data"].map(k => { const u = safeUrl(e.links[k]); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t(k))}</a>` : ""; }).join("");
  return `<tr data-slug="${esc(e.slug)}">
    <td class="name"><a class="entry" href="#${encodeURIComponent(e.slug)}">${esc(e.name)}</a>${e.venue ? `<span class="venue">${esc(e.venue)}</span>` : ""}</td>
    <td class="date">${esc(e.release_date || "—")}</td>
    <td class="types">${e.memory_types.map(v => `<span class="ty" title="${esc(typeDesc(v))}">${esc(v)}</span>`).join("")}</td>
    ${num("conv", e.scale.conversations, t("conv"))}
    ${num("q", e.scale.questions, t("q"))}
    <td class="repro" title="${esc(levelDesc(e.repro_level))}">${esc(e.repro_level)}</td>
    <td class="links">${links || '<span class="muted">—</span>'}</td>
  </tr>`;
}
const activeFilters = () => state.types.size + state.levels.size + state.years.size + state.flags.size;
function update() {
  const rows = visibleEntries();
  visibleSlugs = rows.map(e => e.slug);
  $("list").innerHTML = rows.length ? rows.map(rowHTML).join("") : `<tr><td colspan="7" class="empty">${esc(t("emptyTitle"))} <button type="button" class="linkish" data-action="clear">${esc(t("clear"))}</button></td></tr>`;
  $("count").textContent = t("showing", rows.length, ENTRIES.length);
  $("clear").hidden = !(state.q || activeFilters());
  $("filters-count").textContent = activeFilters() ? `(${activeFilters()})` : "";
  const [key, dir] = state.sort.split(":");
  document.querySelectorAll("#thead th[data-key]").forEach(th => {
    if (th.dataset.key === key) th.setAttribute("aria-sort", dir === "asc" ? "ascending" : "descending"); else th.removeAttribute("aria-sort");
  });
  updateFilters();
  writeURL();
}

/* ---------------- detail panel ---------------- */
const dlg = $("detail");
function detailHTML(e) {
  const link = k => { const u = safeUrl(e.links[k]);
    return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t(k))} ↗</a>` : `<span class="muted">${esc(t(k))}: ${esc(t("none"))}</span>`; };
  const dash = '<span class="muted">—</span>';
  const row = (label, value) => `<tr><th scope="row">${esc(label)}</th><td>${value}</td></tr>`;
  const sources = Object.entries(e.sources || {});
  const runs = e.run_records || [];
  const i = visibleSlugs.indexOf(e.slug), last = visibleSlugs.length - 1;
  const nav = i < 0 ? "" : `<span class="sheet-nav"><button type="button" data-nav="-1"${i === 0 ? " disabled" : ""}>← ${esc(t("prev"))}</button><span class="muted">${i + 1} / ${last + 1}</span><button type="button" data-nav="1"${i === last ? " disabled" : ""}>${esc(t("next"))} →</button></span>`;
  return `<div class="sheet">
    <header class="sheet-head">
      <div><p>${esc([e.venue, e.release_date].filter(Boolean).join(" · "))}</p><h2 id="detail-title">${esc(e.name)}</h2></div>
      <div class="sheet-actions">${nav}<button type="button" data-action="close">${esc(t("close"))}</button></div>
    </header>
    <div class="sheet-body">
      <p class="sheet-links">${link("paper")}${link("code")}${link("data")}<a href="${esc(DATA.repo)}/blob/main/benchmarks/${esc(e.slug)}.yaml" target="_blank" rel="noopener">${esc(t("yaml"))} ↗</a></p>
      <table class="facts"><tbody>
        ${row(t("dConv"), e.scale.conversations != null ? fmtNum(e.scale.conversations) : dash)}
        ${row(t("dQ"), e.scale.questions != null ? fmtNum(e.scale.questions) : dash)}
        ${row(t("dCtx"), e.scale.avg_context_length ? esc(e.scale.avg_context_length) : dash)}
        ${row(t("dJudge"), e.judge_model ? esc(e.judge_model) : dash)}
        ${row(t("dRepro"), `<span class="mono">${esc(e.repro_level)}</span>` + (e.repro_checked_at ? ` <span class="muted">(${esc(t("checked", e.repro_checked_at))})</span>` : ""))}
      </tbody></table>
      <h3>${esc(t("dTypes"))}</h3>
      <ul class="type-defs">${e.memory_types.map(v => `<li><code>${esc(v)}</code>: ${esc(typeDesc(v))}</li>`).join("")}</ul>
      ${e.scale.notes ? `<h3>${esc(t("dScale"))}</h3><p>${linkify(e.scale.notes)}</p>` : ""}
      ${e.metrics.length ? `<h3>${esc(t("dMetrics"))}</h3><ul>${e.metrics.map(m => `<li>${linkify(m)}</li>`).join("")}</ul>` : ""}
      ${e.notes ? `<h3>${esc(t("dNotes"))}</h3><p>${linkify(e.notes)}</p>` : ""}
      ${runs.length ? `<h3>${esc(t("dRuns"))}</h3><table class="runs"><thead><tr>${["runDate", "runModel", "runSample", "runTokens", "runCost", "runNotes"].map(k => `<th>${esc(t(k))}</th>`).join("")}</tr></thead><tbody>${
        runs.map(r => `<tr>${["date", "model", "sample_size", "tokens", "cost", "notes"].map(k => `<td>${esc(r[k] ?? "—")}</td>`).join("")}</tr>`).join("")}</tbody></table>` : ""}
      ${sources.length ? `<details><summary>${esc(t("dSources", sources.length))}</summary><dl class="sources">${sources.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${linkify(v)}</dd>`).join("")}</dl></details>` : ""}
    </div>
  </div>`;
}
function openDetail(e) {
  document.title = `${e.name} · memory-bench-registry`;
  dlg.innerHTML = detailHTML(e);
  if (!dlg.open) dlg.showModal();
  document.body.classList.add("lock");
  dlg.querySelector(".sheet-body").scrollTop = 0;
}
const hashSlug = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ""; } };
function syncHash() {
  const e = BY_SLUG.get(hashSlug());
  if (e) openDetail(e); else if (dlg.open) dlg.close();
}
function go(delta) {
  const i = visibleSlugs.indexOf(hashSlug()), next = i < 0 ? null : BY_SLUG.get(visibleSlugs[i + delta]);
  if (!next) return;
  history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent(next.slug));
  openDetail(next);
  dlg.querySelector(`[data-nav="${delta}"]:not([disabled])`)?.focus({ preventScroll: true });
}
dlg.addEventListener("close", () => {
  document.title = "memory-bench-registry";
  document.body.classList.remove("lock");
  if (BY_SLUG.has(hashSlug())) history.replaceState(null, "", location.pathname + location.search);
});
dlg.addEventListener("click", ev => {
  const nb = ev.target.closest("[data-nav]");
  if (nb) { if (!nb.disabled) go(Number(nb.dataset.nav)); return; }
  if (ev.target === dlg || ev.target.closest('[data-action="close"]')) dlg.close();
});
window.addEventListener("hashchange", syncHash);

/* ---------------- events ---------------- */
$("filters").addEventListener("click", ev => {
  const d = ev.target.closest(".def-toggle");
  if (d) { const panel = $(d.getAttribute("aria-controls")); panel.hidden = !panel.hidden; d.setAttribute("aria-expanded", String(!panel.hidden)); return; }
  const b = ev.target.closest("button[data-facet]"); if (!b) return;
  const set = state[b.dataset.facet], v = b.dataset.value;
  set.has(v) ? set.delete(v) : set.add(v);
  update();
});
$("thead").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-sort]"); if (!b) return;
  const key = b.dataset.sort, [cur, dir] = state.sort.split(":");
  state.sort = `${key}:${cur === key ? (dir === "asc" ? "desc" : "asc") : SORT_KEYS[key].first}`;
  update();
});
$("q").addEventListener("input", ev => { state.q = ev.target.value.trim(); update(); });
function clearAll() {
  state.q = ""; $("q").value = "";
  for (const k of ["types", "levels", "years", "flags"]) state[k].clear();
  update();
}
$("clear").addEventListener("click", clearAll);
$("list").addEventListener("click", ev => {
  if (ev.target.closest('[data-action="clear"]')) return clearAll();
  if (ev.target.closest("a")) return; // links do their own thing; a click anywhere else on the row opens the detail
  const tr = ev.target.closest("tr[data-slug]");
  if (tr) location.hash = encodeURIComponent(tr.dataset.slug);
});
document.addEventListener("keydown", ev => {
  if (dlg.open && (ev.key === "ArrowLeft" || ev.key === "ArrowRight") && !ev.metaKey && !ev.ctrlKey && !ev.altKey && !ev.shiftKey) { go(ev.key === "ArrowLeft" ? -1 : 1); return; }
  if (ev.key === "/" && !dlg.open && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { ev.preventDefault(); $("q").focus(); }
});
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  renderStatic(); update();
  if (dlg.open) syncHash();
}));
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  renderTheme();
});

// The filter block is folded on narrow screens, open on wide ones.
const narrow = matchMedia("(max-width: 760px)");
narrow.addEventListener("change", () => { $("filters-box").open = !narrow.matches; });

/* ---------------- start ---------------- */
readURL();
$("filters-box").open = !narrow.matches || activeFilters() > 0;
$("q").value = state.q;
renderStatic();
update();
syncHash();
</script>
</body>
</html>
