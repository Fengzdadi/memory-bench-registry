  notes: questions = 111 SWE-style coding targets (bug fixes, feature requests, interface changes, configuration work) from 90 SWE-rebench V2 repositories. conversations = 3,634 completed history trajectories from earlier tasks in the same repositories, which memory systems ingest. Each condition runs 4 seeds (444 target-seed runs). No train/test split. The paper gives no length statistics for the history trajectories.
metrics:
- Resolved (share of target-seed runs whose declared executable test predicate passes), with 95% bootstrap CI over targets
- 4/4 (targets resolved in all four seeds)
- Paired memory effect (memory-on minus memory-off Resolved)
- Input tokens per run (solver side)
- Output tokens per run (solver side)
- Agent steps per run
