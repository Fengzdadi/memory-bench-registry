  notes: 5,653 = sum of paper Table 3 test edit instances over six datasets (WikiData_recent 1,266; ZsRE 1,230; WikiBio 1,392; WikiData_counterfact 885; ConvSent 800; Sanitation 80); train splits total 27,087. Released HF test files hold 4,592 items (ZsRE 1,301; WikiBio 306; counterfact 839), counted 2026-10-10. No dialogue/conversation structure.
