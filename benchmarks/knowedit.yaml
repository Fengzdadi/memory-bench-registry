notes: KnowEdit re-organizes six existing datasets (WikiData_recent, ZsRE, WikiBio, WikiData_counterfact, ConvSent, Sanitation) to evaluate editing knowledge in LLMs (insertion, modification, erasure); main model Llama2-7b-chat. arXiv v5 (2024-11) revised Table 4 after EasyEdit bug fixes. Released HF file counts differ from paper Table 3 for ZsRE, WikiBio and WikiData_counterfact. examples/KnowEdit.md cites run_Sanitation_llama2.py, but the repo file is examples/run_santinization_llama2.py. HF data is MIT-licensed and ungated; the ZsRE training set is distributed via Google Drive.
