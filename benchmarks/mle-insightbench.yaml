  links.data: 'null: no dataset link in the paper; Hugging Face searches (author BihuiJ, ''InsightBench'', ''InsightForge'') found no MLE-InsightBench dataset (checked 2026-10-10)'
  scale.questions: '§3 and Table 1: 12 target tasks, one per domain; §5.1 ''We evaluate on the 12 held-out target tasks'' (T=12, K=6, 72 runs per condition)'
