  metrics: §5.1 Metrics paragraph, Eq. (1), Table 3 (normalized private-test and validation scores, tokens, time, cost), Table 1 (task metrics), Table 4 (per-task change, significance)
  judge_model: 'null: §5.1 says the private-test score is ''computed by the task''s MLE-bench-compatible grader''. An LLM filters writeups only during insight assembly (§4.1.2), and it is not an evaluation judge'
