  memory_types: '§3 Held-out split: insights come from source competitions that are causal non-descendants of each target, reflecting that ''an agentic MLE system facing a new task can draw on prior experience''; §4.2.2 injects insights (domain, competition and improvement strategies) as on-demand skills or a playbook; §5 scores task performance on held-out targets with and without these insights'
  links.paper: arXiv abs page 2610.04927
