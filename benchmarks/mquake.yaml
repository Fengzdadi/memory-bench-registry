  notes: 3,000 = instances in MQuAKE-CF-3k-v2, the main evaluation subset. Each instance has 3 GPT-generated multi-hop questions (9,000 strings), 1-4 edits and 2-4 hops. The full MQuAKE-CF set has 9,218 instances. MQuAKE-T (real temporal updates) has 1,868. The data is not conversational, so there is no context length.
