  notes: 'questions = 240 business tasks in 24 task groups (V1: 120 tasks/12 groups in CRM, ERP and finance; V2 adds 120 tasks/12 groups in healthcare, legal and data work). Each group has 5 training tasks for evolution and 5 held-out test tasks; accuracy is scored on the 120 test tasks, 3 runs each. There are no conversations. The repo has 120 train and 120 test task directories (counted on 2026-10-10).'
metrics:
- Accuracy (macro-averaged rubric score on held-out test tasks, mean of 3 runs)
- Standard deviation across task groups
- Lift (pp) over base
- Cost (USD per task)
- Rounds (agent turns)
- Tokens
- Tool calls per test
- Skill-generation (evolve) cost
