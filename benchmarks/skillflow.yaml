notes: Tasks are Docker-based Harbor environments with programmatic verifiers, so running them needs Docker, the Harbor CLI, and API keys for the agent CLIs. The README points to a shared_skills_template/ directory that was missing from the repo tree when counted on 2026-10-10. The repo has no licence file, and the HF dataset licence is "other". The README BibTeX title differs from the arXiv title. Final evolved skill libraries are released separately as zhang-ziao/SkillFlow-exp-skills on HF.
sources:
  name: 'arXiv API title: ''SkillFlow:Benchmarking Lifelong Skill Discovery and Evolution for Autonomous Agents'''
  release_date: 'arXiv API: 2604.17308v1 published 2026-04-19 (only v1 listed)'
  venue: 'arXiv API entry has no journal_ref/comment; paper v1 has no venue; README BibTeX: ''arXiv preprint arXiv:2604.17308'''
  memory_types: 'paper Abstract/Sec 2.4: agents start without skills, solve tasks in sequence within each family, write trajectory- and rubric-driven skill patches, and carry the updated skill library forward (Agentic Lifelong Learning protocol)'
  links.paper: arXiv abs page 2604.17308
  links.code: paper Abstract links github.com/ZhangZi-a/SkillFlow; README links back to the arXiv paper
  links.data: 'repo README ''Hugging Face Data'' link; HF API: zhang-ziao/SkillFlow-Task is public and not gated, with 2656 files under test_tasks/'
  scale.questions: 'paper Abstract: ''166 tasks across 20 families''; HF dataset card says 166 runnable tasks; 166 instruction.md files counted via HF API on 2026-10-10'
  scale.conversations: 'null: task-based agent benchmark with no dialogue/conversation units'
  scale.avg_context_length: 'null: paper reports no input context length (only output tokens and per-model turns in Table 1)'
  scale.notes: paper Sec 2.1 (8-9 tasks per family, five domains); Table 1 per-task average turns
  metrics: 'paper Sec 2.5 and Table 1: task success rate, efficiency (interaction turns, monetary cost, output tokens), and skill generation/reuse (#Skills, %use)'
  judge_model: 'null: success means the output passes the task verifier (programmatic tests/test.sh, test_outputs.py per the HF card). The LLMs the paper names (Claude Opus 4.6 critic agent, GPT-5.3-Codex architect agent) are used only for task construction, not for scoring'
  repro_level: repo tree has family_job_runner.py (baseline) and iterative_shared_skills_runner.py (skill evolution) with configs/baseline.yaml and configs/iter.yaml listing all 20 families; task data downloadable from HF (checked 2026-10-10)
  notes: repo tree via gh api (no shared_skills_template/, license null); HF API cardData license 'other'; HF API zhang-ziao/SkillFlow-exp-skills public (1793 files)
