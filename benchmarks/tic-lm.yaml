  notes: 'No dialogue or QA set. Training data is TiC-CC: 114 monthly Common Crawl dumps (May 2013 to Jul 2024), 2.9T tokens in the training shard, of which runs use 220B or 440B. Evals: TiC-CC held-out (capped at 8,192 sequences of 2,048 tokens per month), TiC-CC-Wiki/News, TiC-Wiki (61 months, 10k changed and 10k unchanged), TiC-StackE (at least 500 questions per period), TiC-CodeDocs (16 NumPy and 11 PyTorch releases).'
metrics:
- Perplexity (token-level ppl_token, answer-level ppl_answer, proper-noun ppl_noun)
- Regret vs. Oracle-2024-07
- In-distribution (ID)
- Backward transfer
- Forward transfer
- DCLM Core average accuracy (static downstream evals)
