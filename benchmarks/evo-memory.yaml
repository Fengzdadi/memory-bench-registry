  notes: 'questions = 3,716 is the sum of the per-dataset counts in v2 Appendix F; the paper states no total. Single-turn: 3,320 (MMLU-Pro Eng 969 / Econ 844 / Philo 499, GPQA-Diamond 198, AIME-24/25 30 each, ToolBench 750). Multi-turn: 396 tasks (AlfWorld 134, BabyAI 112, ScienceWorld 90, PDDL 60). No conversations: each dataset is one ordered task stream.'
