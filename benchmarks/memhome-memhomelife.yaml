notes: Chinese-language smart-home benchmarks from Midea AI Research Center, built from anonymized real user logs. MemHome = single-session samples with candidate memories; MemHomeLife = multi-session dialogues with evolving memory. The abstract says model and data "will be open-sourced soon"; no official repo, Hugging Face dataset or paper-linked release was found (checked 2026-10-10). LLM-as-judge accuracy uses two unnamed judge models plus a third as tie-breaker. Content-level judging is skipped for No-Memory samples. MemHomeLife sample count is not reported.
