  memory_types: 'pyproject.toml description ''multi-domain benchmark for evaluating procedural memory in AI agents''; docs/AGENT_LEARNING_TRACK.md: learnings extracted from 100 train trajectories per domain are scored on 50 held-out test tasks per domain (''whether learnings extracted from past trajectories improve agent performance'')'
  links.paper: 'null: no paper. The only write-up is the blog https://opensource.microsoft.com/blog/2026/05/19/introducing-state-bench-a-benchmark-for-ai-agent-memory/'
