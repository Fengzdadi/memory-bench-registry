scale:
  conversations: 300
  questions: 150
  avg_context_length: null
  notes: 'questions = 150 held-out test tasks (50 per domain: travel, customer support, shopping assistant). Each is a simulated multi-turn conversation, run 5 times. conversations = 300 train trajectories (100 per domain) supplied for learning extraction. There are 450 scenarios in total, and the current main branch ships all 150 task definitions per domain (counted 2026-10-10). No average length is reported.'
metrics:
- Task Completion pass@1 (average over 5 runs; deterministic final-state checks plus an LLM judge for procedural/informational requirements)
- 'Task Completion pass^5 (reliability: tasks passed on all 5 runs)'
- UX Score (LLM-judged, 1-5)
- Cost Per Task (USD)
judge_model: GPT-5.1
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: No accompanying paper was found (arXiv API and web search, 2026-10-10). The benchmark was released through the GitHub repo (first release v0.4.5, 2026-05-20) and the Microsoft Open Source Blog (2026-05-19). Memory is evaluated in the Agent Learning Track, and the Main Track (no learning) uses the same test split. The locked simulator and judge moved from GPT-5.1 to GPT-5.4 in v0.7.0, so official runs need GPT-5.4 access. The data is LLM-generated synthetic data under the MIT licence. Not to be confused with Hugging Face parslee/statebench.
sources:
  name: 'repo README.md title and blog ''Introducing STATE-Bench: A benchmark for AI agent memory''; blog expands it as ''Stateful Task Agent Evaluation Benchmark'''
