  avg_context_length: '~13.3K tokens per conversation (Table 2: 13,291.6 avg tokens/conversation)'
  notes: 'conversations = 18 multi-session conversations, one per virtual user, with 401 sessions in total. Table 2 also gives 22.3 avg sessions/conv, 23.4 avg turns/session and a 14.9-month avg span; the Intro says about 510 turns and up to 33 sessions. questions = 1,209 QA items: IE 271, TR 236, CD 226, UM 251, Abs 225. Other tasks are summarization (125) and dialogue generation (34 scenarios). The paper reports different session counts in different places: 22.3 avg sessions/conv in Table 2 and 27.2 in Sec 4.3. The released data/evo_emo.json matches the paper on 18 users, 401 sessions, 125 summaries and 34 scenarios, but a registry count of it gives 1,427 QA items, not 1,209.'
metrics:
- F1 score (QA)
- BERTScore (QA)
- LLM-as-Judge score 0-2 (QA)
- Recall@k (retrieval)
- nDCG@k (retrieval)
- ROUGE-1/ROUGE-2/ROUGE-L (summarization)
- Event-based Precision/Recall/F1 (summarization)
- LLM score 0-5 (summarization)
- Observation Recall (dialogue generation)
- Weighted Score (dialogue generation)
- LLM ratings 1-5 for LT-Mem., Pers., ES (dialogue generation)
judge_model: GPT-4o (QA, summarization and dialogue-rating judge); Mistral-Small-3.1-24B-Instruct-2503 for dialogue-generation observation-based metrics
repro_level: official_script
