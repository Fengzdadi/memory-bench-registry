  notes: conversations = 50 main evaluation scenarios (paper §3.1, 2-6 tasks each). questions = 203 task instances, counted in repo traineebench_config.json on 2026-10-10 (the paper gives no total). A separate continual-learning set has 50 two-day scenarios (§3.3), with 414 task instances in traineebench_cl_config.json. No context length is reported.
