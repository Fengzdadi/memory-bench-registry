  judge_model: Paper §6.4 'LLM-as-a-Judge (using GPT-4o-mini)' and Appendix A.4; repo easyeditor/evaluate/evaluate_utils.py llm_judge uses model='gpt-4o-mini'
  repro_level: Repo has edit.py (--datatype qaedit, --evaluation_type WILD|synthetic, --api_key for the judge), easyeditor/evaluate/evaluate.py (WILD branch), easyeditor/evaluate/evaluate_utils.py (llm_judge, exact_match_score), and data/QAEdit.json; HF data downloaded and counted (checked 2026-10-10)
