run_records: []
notes: No public data or code as of 2026-10-10. The project page says "DATA COMING SOON" and lists GitHub as "coming soon". The paper mentions an anonymous GitHub repo but gives no URL. saroo25/Egostream only holds the website source. Questions are built on five existing egocentric datasets (Ego4D, EgoLife, EgoTempo, Multi-Hop EgoQA, HD-EPIC), so the source-video licences apply. Gemini 3.1 and Gemini 2.5 Pro helped build the dataset (rewriting, distractors, labels); scoring uses no LLM. The paper's baselines are KV-cache memory policies on Qwen3-VL.
sources:
  name: 'arXiv 2605.31557 title/abstract (''EGOSTREAM'' in title, ''EgoStream'' in body text); NeurIPS 2026 accepted-papers JSON lists ''EgoStream: A Diagnostic Benchmark for Streaming Episodic Memory in Egocentric Vision'''
  release_date: 'arXiv API: 2605.31557v1 published 2026-05-29T17:20:10Z (v2 2026-06-01)'
  venue: 'neurips.cc/static/virtual/data/neurips-2026-orals-posters.json entry id 139373: decision ''Accept (poster)'', sourceurl NeurIPS.cc/2026/Evaluations_and_Datasets_Track, OpenReview forum UDecnw8V7B; also the authors'' lab page (coai-iplab.github.io/research/forte2026egostream) lists NeurIPS 2026. The arXiv entry has no journal_ref.'
  memory_types: 'paper Sec. 3 and abstract: recall of egocentric video evidence over time, with 7 episodic memory categories and recall regimes from instant to ultra-long (episodic); the evaluated streaming MLLMs process the video frames directly at 1 FPS, per App. C.1 (multimodal). Not embodied: the system does not act in an environment.'
  links.paper: arXiv abs page 2605.31557
  links.code: null. The project page (saroo25.github.io/Egostream) shows 'GitHub (coming soon)' with no link. The GitHub repo saroo25/Egostream contains only the static site (index.html, styles.css, script.js, server.py, assets), and its README calls it a 'Static landing page'. The paper's 'anonymous GitHub repository' has no URL in the arXiv HTML.
