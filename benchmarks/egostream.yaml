  scale.questions: 'paper Sec. 3.1-3.2 (arXiv v2 HTML): 2,634 initial QA sets became 2,335 after human validation and 2,250 valid questions after filtering; per-source counts in Sec. 3.2; 8,528 recall-conditioned evaluations in Sec. 3.4'
  scale.conversations: 'null: the paper does not report a number of videos or episodes'
  scale.avg_context_length: 'null: the paper reports no average video length. The recall regimes in Table 3 run from 0 s to >8 h, and the project page gives a maximum AVW of 45.3 h.'
  metrics: paper Sec. 3.4 (standard accuracy on the 4-way multiple-choice setup, chance 0.25, broken down by semantic category and recall regime, with average processing time per frame); Table 4 (macro-averages and Proc. time); Table 5 (memory budget in tokens); Sec. 5.1 (storage in GB x min for offloading)
  judge_model: 'null: scoring is multiple-choice accuracy (Sec. 3.4). Gemini 3.1 and Gemini 2.5 Pro were used only to construct and label the dataset (Sec. 3.1, 3.3, App. A), not to judge answers.'
