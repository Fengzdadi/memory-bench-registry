  notes: 2,250 human-validated 4-way multiple-choice questions, drawn from Multi-Hop EgoQA (578), Ego4D EM (498), EgoLife (433), EgoTempo (425) and HD-EPIC (316). They expand into 8,528 recall-conditioned evaluations across 7 recall regimes, from instant (0 s) to ultra-long (>8 h). The paper gives no video count or average video length. The project page lists a maximum Answer Validity Window of 45.3 h.
metrics:
- Multiple-choice accuracy (4-way; chance 25%), broken down by 7 semantic memory categories and 7 temporal recall regimes, with macro-averages
- Average processing time per frame (s)
- Memory budget (tokens) / offloading storage (GB x min)
