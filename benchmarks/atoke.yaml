  notes: '8,820 is the number of temporal fact chains (edit cases) the paper gives as the final size of each of the three datasets: AToKe-SE (single edit), AToKe-ME (multiple edits) and AToKe-EE (extending edit). Each case has several cloze/QA probes: CES, CES-P, CRS, HES and HRS. The benchmark has no dialogue or context, so the conversation and context-length fields do not apply.'
metrics:
- CES (Current Explicit time question Score, accuracy)
- CES-P (Current Explicit time Paraphrase question Score)
- CRS (Current Relative time question Score)
- HES (Historical Explicit time question Score)
- HRS (Historical Relative time question Score)
- HES* (HES over all historical facts after all multiple edits, AToKe-ME)
judge_model: null
repro_level: data_public
