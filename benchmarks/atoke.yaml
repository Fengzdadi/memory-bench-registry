run_records: []
notes: 'Knowledge-editing benchmark: edits are written into the weights of GPT-J (6B) with CFT, MEND, ROME and MEMIT. The repo has no licence file and contains only the three JSON datasets; the README''s METO section is empty, and no editing or evaluation code is released. Counted on 2026-10-10: AToKe-SE and AToKe-EE have 8,819 cases each. AToKe-ME has 8,820 cases, including case_id 2771 with no edits, and 18,644 edits in total. The release has 9 relations; the paper states 13.'
sources:
  name: 'arXiv abstract and paper section ''ATOKE: Assessment of Temporal Knowledge Editing'' (benchmark ATOKE / AToKe)'
