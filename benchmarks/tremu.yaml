notes: The paper does not name the benchmark; TReMu is the name of the proposed framework (timeline-summarization memory plus Python-code temporal reasoning). The QAs were generated by GPT-4o from LoCoMo dialogues, then reviewed manually. Each question has 3 or 5 options. arXiv v2 says code and data "will be released", but as of 2026-10-10 no official repo or dataset was found on GitHub, Hugging Face or the ACL Anthology page.
sources:
  name: 'arXiv title ''TReMu: Towards Neuro-Symbolic Temporal Reasoning for LLM-Agents with Memory in Multi-Session Dialogues''; benchmark itself unnamed in paper (arXiv v2 HTML §2)'
  release_date: 'arXiv API: 2502.01630v1 published 2025-02-03'
  venue: arXiv comment 'Accepted at ACL 2025 Findings'; ACL Anthology 2025.findings-acl.972 (Findings of ACL 2025, July 2025, pp. 18974-18988)
  memory_types: 'arXiv v2 §2.1-2.2: temporal QAs (anchoring, precedence, interval) over events in multi-session LoCoMo dialogues'
  links.paper: arXiv API entry 2502.01630
  links.code: 'null: no URL in paper v1/v2 or on ACL Anthology page; GitHub search (TReMu, arXiv id, amazon-science org, first author''s account ERnest666) found no official repo (checked 2026-10-10)'
  links.data: 'null: HF datasets search ''tremu'' empty; HF paper page 2502.01630 has no linked datasets (checked 2026-10-10)'
  scale.conversations: 'null: paper never states the number of LoCoMo conversations used (v1 and v2 checked)'
  scale.questions: 'paper Table 2 (arXiv v2 HTML): Total 600; Total-Unanswerable 112; 264/102/234 per type'
  scale.avg_context_length: 'paper Table 1 (LoCoMo (Ours) row): 304.9 avg turns, 19.3 avg sessions, 9,209.2 avg tokens; §2.1 text gives conflicting ~600 turns/16,000 tokens'
  metrics: 'paper §4.1 Experimental Setup: accuracy overall; precision/recall/F1 for unanswerable questions'
  judge_model: 'null: multiple-choice accuracy against ground truth; no LLM judge described (GPT-4o used only for QA construction, §2.2)'
  repro_level: no official code or data found on GitHub, Hugging Face, or ACL Anthology; v2 §7 Limitations only promises release (checked 2026-10-10)
  notes: 'arXiv v2 §7 Limitations: ''we will release our code and dataset for reproducibility'''
