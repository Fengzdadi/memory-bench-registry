links:
  paper: https://arxiv.org/abs/2307.12976
  code: https://github.com/edenbiran/RippleEdits
  data: null
scale:
  conversations: null
  questions: 4000
  avg_context_length: null
  notes: questions = factual edits in paper Table 1 (Recent 2,000; Random 1,000; Popular 1,000). Each edit has ~18.8-26.8 test queries across six criteria (v2 Table 1); the paper gives no total query count. Released JSONs hold 4,755 edits (1,948/1,922/885) and 46,754 test queries. No conversations; prompts are short single sentences.
metrics:
- 'Accuracy per evaluation criterion (Logical Generalization, Compositionality I, Compositionality II, Subject Aliasing, Preservation/Forgetfulness, Relation Specificity): a generation (max 20 tokens) counts as correct if any alias of the target object appears in it'
- Average accuracy across criteria (Avg.)
judge_model: null
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: The paper (v1 and the TACL version) reports 4,000 edits, but its abstract says "5K". The released repo files hold 4,755 edits (Random has 1,922, not 1,000), counted on 2026-10-10. Results cover only edits that succeeded for each model and method (Table 2). src/evaluation.py samples 200 edits per subset and also instantiates an OpenAI text-davinci-003 executor. The v1 criterion "Forgetfulness" appears as "Preservation" (PV) in v2. The code is MIT-licensed.
sources:
