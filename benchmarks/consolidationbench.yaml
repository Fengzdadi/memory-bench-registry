  notes: The paper reports no instance or question counts. Experience streams are generated procedurally in medium and hard configurations, with raw experience mass 7.3x/9.4x the reference budget. The leaderboard ranks 10 policies (medium). A separate external-validity study used 12 policies and 2,532 answer cells on LoCoMo multi-hop and 2WikiMultiHopQA, which are not part of ConsolidationBench.
metrics:
- Retention (oracle-normalized task success, RetN)
- Compression (token-mass ratio under matched budget)
- Reuse / Transfer (success on novel composite tasks)
- Consolidation Quality Score (CQS; original multiplicative CQS0 and graded geometric-mean CQS with epsilon=0.05)
- 'Governance checks: false rules admitted from poison decoys (G1), rollback recovery (G2), ledger completeness (G3), CQS0 retained (G4)'
