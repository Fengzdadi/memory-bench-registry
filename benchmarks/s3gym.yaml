  notes: 'Not QA/dialogue-based: 7 text games (Chess, Minesweeper, Nullify, Tetris, Snake, PvZ, Trust Evolution). Per model-game-pathway: 30 permissive exploration episodes, then 3 strict-mode evaluation episodes at each of 11 checkpoints (0,3,...,30); max 5-64 steps/episode; History-ICL input capped at 100,000 tokens. Self-judging analysis: 98 runs, 116,117 transitions. Training study: Qwen3-8B, 20 checkpoints.'
metrics:
- Avg. evaluation score over checkpoints
- Max. evaluation score
- AUC+ (positive area above initial score)
- Delta Final (final minus initial score, training study)
- NABA (normalized above-baseline area)
- Self-judging event agreement
- NMAE (normalized mean absolute error of self-judged vs verifier reward)
- Over-confidence / under-confidence rate
- Judgment-improvement correlation rho(A,g), rho(-E,g) and tertile gaps
