scale:
  conversations: 820
  questions: 820
  avg_context_length: about 10K tokens (participation) / about 1K tokens (observation)
  notes: 'Counts are the paper''s main test set, Sub-dataset 1 (§4.1). Participation has 120 reflective + 360 factual items and observation has 60 reflective + 280 factual items, so the 820 total is a sum of the reported figures. Each item is one trajectory (dialogue sessions or a user message list) ending in one 4-option multiple-choice question; the repo env and data format store one ''QA'' per trajectory. Sub-dataset 2 is the noise-extended 100k setting: 30 + 90 participation items (about 100K tokens each) and 15 + 84 observation items (about 10K tokens each), 219 in total. The full released dataset is given in Table 2 as rounded figures (sessions / questions / trajectories / avg tokens per trajectory): PS-RM 3.5k / 3.5k / 3.5k / 2,195; PS-FM 51k / 39k / 8k / 10,285; OS-RM 2k / 2k / 2k / 745; OS-FM 8.5k / 8.5k / 8.5k / 617. It is built on 500 user relation graphs. Per-type breakdowns are in Tables 8-9; the Table 9 caption says ''Participation'' but the text calls it the Observation statistics. The released MemData files checked by the registry hold one QA per trajectory (FirstAgent/simple.json has 2 x 500 trajectories), so question counts taken from the files may differ from Table 2.'
metrics:
- Accuracy (multiple-choice, exact match)
- Recall@10 (retrieval of key evidence turns; retrieval-based memory only)
- Capacity (accuracy as accumulated memory tokens grow)
- Read time (RT, seconds per operation)
- Write time (WT, seconds per operation)
