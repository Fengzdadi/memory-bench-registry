run_records: []
notes: 'This is MemBench by Tan et al. (arXiv 2506.21605), not one of the unrelated papers with the same name. It has two scenarios: participation (first-person user-assistant dialogue, repo MemData/FirstAgent) and observation (third-person user message lists, MemData/ThirdAgent). It tests factual memory (single-hop, multi-hop, comparative, aggregative, post-processing, knowledge-updating, single- and multi-session-assistant) and reflective memory (preference, emotion). All questions are 4-option multiple choice scored by exact match. The paper compares 7 memory mechanisms built with MemEngine, mainly on Qwen2.5-7B-Instruct and also on gpt-4o-mini, Llama-3.1-8B-Instruct and GLM-4-9B-chat. Noise from a News dataset extends contexts to about 100K tokens. The repo contains the data, generation code and a harness (benchmark/env/Membenenv.py scores accuracy and recall; benchmark/MembenchAgent.py; benchmark/memory/), but it has no runner script. The imported benchutils and utils modules are missing, requirements.txt is only a Git LFS pointer, and the makenoise.py and data2test that the README mentions are not in the repo tree. The README badge says MIT, but the repo has no LICENSE file and GitHub reports no licence. The full data zip (Membenchdata.zip) is also on Google Drive and on Baidu Pan (extraction code yzsj). The Hugging Face dataset mteb/MemBench is a third-party retrieval conversion (source KaLM-Embedding/LMEB), not an official release.'
sources:
  name: 'paper title (arXiv 2506.21605 abs page) and repo README heading ''MemBench: Towards More Comprehensive Evaluation on the Memory of LLM-based Agents'''
  release_date: 'arXiv abs page submission history: [v1] Fri, 20 Jun 2025 (only version). The arXiv API returned HTTP 429 on 2026-10-10, so the abs page was used.'
  venue: 'ACL Anthology 2025.findings-acl.989: ''Findings of the Association for Computational Linguistics: ACL 2025'', July 2025, pp. 19336-19352; arXiv comment ''Accepted by ACL 2025 findings'''
  memory_types: paper §1, §3.4 and Tables 6-7. Factual memory over multi-session user-assistant dialogues, including multi-hop and multi-session-assistant questions, gives conversational_longterm. Reflective memory infers the user's high-level preferences (movie/food/book) and emotional state, which gives personalization. The 'Knowledge-updating' question type ('basis for answering questions will be updated over time') gives semantic_knowledge_update.
  links.paper: arXiv abs page 2506.21605; the repo README badge links the same URL
  links.code: paper abstract and §1 ('released our dataset and project at https://github.com/import-myself/Membench'); the ACL Anthology page links the same repo
  links.data: repo README 'Data location' gives a Google Drive link (page title 'Membenchdata.zip - Google Drive', HTTP 200 on 2026-10-10) and a Baidu Pan alternative. No official Hugging Face dataset was found.
  scale.conversations: 'paper §4.1: Sub-dataset 1 = 120 + 360 participation + 60 + 280 observation sampled items, summed to 820. Each item is one trajectory, per the repo benchmark/env/Membenenv.py (one trajectory per reset, one QA each).'
  scale.questions: paper §4.1 Sub-dataset 1 sizes (120 + 360 + 60 + 280 = 820), with one multiple-choice question per item (paper §3.4; repo MemData format has one 'QA' per trajectory)
  scale.avg_context_length: 'paper §4.1: participation ''each session has about 10K tokens'', observation ''each message list has about 1K tokens'' (Sub-dataset 1); Table 2 also gives TPT (avg tokens per trajectory) of 2,195 / 10,285 / 745 / 617'
  metrics: paper §3.4 (Memory Accuracy, Retrieval Recall, Capacity, Temporal Efficiency); Table 3 columns Accuracy, RT and WT plus a Recall@10 sub-table; Figure 5 (capacity)
  judge_model: 'paper §3.4: all questions are multiple-choice and accuracy compares the agent''s choice with the true choice. No LLM judge; the repo Membenenv.py checks response == ground_truth.'
  repro_level: 'repo checked 2026-10-10. MemData/FirstAgent/*.json and MemData/ThirdAgent/*.json are real JSON in the repo (downloaded and parsed 3 files), and the Drive zip is linked. There is no runnable evaluation entry point: benchmark/ has only the env, agent and memory classes, it imports a benchutils module that is absent, and there is no main or runner script. That makes the level data_public.'
