  notes: 'questions = 500 subtasks: 5 domains (Healthcare, Law, Mathematics, Finance, Office) x 100 ordered subtasks, each domain solved as one sequential stream. There is no conversation unit, so conversations is null. The repo also ships science-100 (100 subtasks, not in the paper) and per-domain independent-trial splits. The paper reports no context-length statistics.'
metrics:
- Raw reward (mean score over the 100 subtasks of a domain)
- Normalized reward (only tasks with valid outputs under both Sequential and Independent)
- Delta_raw / Delta_norm (Sequential minus Independent gain)
- 'Per-subtask scoring: exact match, token-level F1, numeric with tolerance, rubric-based LLM judge, programmatic tests'
- Skill invocation frequency and final skill repository size
- Generated-skill quality score (format x content, judged by GPT-4.1-mini)
judge_model: null
