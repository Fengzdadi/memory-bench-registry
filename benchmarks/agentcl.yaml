notes: The HF dataset is public, not gated and licensed CC BY-NC 4.0. As of 2026-10-10 no official code exists for the evaluation harness or MemProbe; the paper links only the data. The release also contains HumanEval-Pro and MBPP-Pro dependent/conventional streams that Table 1 does not list. BrowseComp+ streams ship queries and qrels and need the separate BrowseComp+ corpus to run. The BabyAI, ScienceWorld and MMLU-Pro streams are unmodified subsets of the public source datasets. Paper checked at v3 (2026-09-26).
sources:
  name: 'arXiv API title ''AgentCL: Toward Rigorous Evaluation of Continual Learning in Language Agents''; HF dataset card pretty_name AgentCL'
  release_date: 'arXiv API: 2606.02461v1 published 2026-06-01 (abs page submission history: v1 1 Jun 2026, v2 2 Jun 2026, v3 26 Sep 2026)'
  venue: arXiv API has no journal_ref; the comment reads only '9 pages in the main text, 28 pages in total'; HF card BibTeX gives 'arXiv preprint arXiv:2606.02461'; the paper text names no venue
  memory_types: 'Paper §3.3: Plasticity/Stability/Generalization Gain measure whether non-parametric memory built from earlier tasks in a stream helps later tasks and held-out independent tasks (procedural_workflow). §4.1: CodeEval-Pro dependent streams guarantee a function-reuse relation from earlier subtasks to later complex coding tasks (coding_cross_session). AgentBoard BabyAI streams (navigation, pickup, door opening, unlocking) are scored by SR/PR in Table 3 (embodied).'
  links.paper: arXiv abs page https://arxiv.org/abs/2606.02461 (resolves, HTTP 200)
  links.code: 'null: the paper footnote links only the data (''Data is available at https://huggingface.co/datasets/osunlp/AgentCL''). GitHub searches for AgentCL/MemProbe and the OSU-NLP-Group and yhshu repo listings found no official repo (checked 2026-10-10)'
  links.data: 'Paper abstract footnote plus HF API: osunlp/AgentCL, private=false, gated=false, license cc-by-nc-4.0, tagged arxiv:2606.02461'
  scale.conversations: 'null: the benchmark consists of agent task streams, not conversations'
  scale.questions: 'null: the paper reports only per-stream counts (Table 1 plus 120 HumanEval-Pro independent tasks in §4.1) and no single total'
  scale.avg_context_length: 'null: the paper gives no average context length for the streams'
  scale.notes: Paper Table 1 and §4.1 (arXiv v3 HTML); HF README stream table
  metrics: 'Paper §3.3: basic metrics ''accuracy, success rate, or progress rate'' plus PG_i=F_i-B_i, SG_i=S_i-F_i, GG_j=H_j-B_j; Tables 3/11/13 report SR/PR and accuracy'
  judge_model: 'null: the paper names no LLM judge for scoring. An unnamed LLM judge appears only inside MemProbe''s memory consolidation (§5.2), and GPT-5.2 is used only to synthesize BrowseComp+ subtasks (§4.1, App. D.1)'
  repro_level: HF dataset osunlp/AgentCL lists data files (codeeval-pro/*.json, browsecomp_plus/*, agentboard_*/*.jsonl, mmlu_pro/test_300.json). bigcodebench_lite_pro.dependent.json downloaded with 96 records (48 raw + 48 new) and browsecomp_plus/queries.tsv with 408 rows. No official evaluation script or repo found (checked 2026-10-10)
  notes: HF README (licence, data sources, extra HumanEval-Pro/MBPP-Pro files); paper §4.1 (BrowseComp+ offline corpus); arXiv abs submission history
