  notes: 'Task streams, not conversations, and the paper gives no overall total. Table 1 dependent streams: BigCodeBench-Lite-Pro 48 subtasks + 48 complex, BrowseComp+ 308 synthesized subtasks + 100 complex, BabyAI 28 + 28. Conventional streams: 48, 100, 40, ScienceWorld 90 and MMLU-Pro 300. Another 120 HumanEval-Pro tasks are held out as independent tasks.'
