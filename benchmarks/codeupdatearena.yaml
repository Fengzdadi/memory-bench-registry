  notes: 670 = program synthesis (PS) examples, the single HF test split (670 rows counted 2026-10-10), covering 161 synthetic API updates to 54 functions in 7 Python packages, with at least 3 PS examples per update. Specificity uses 82 HumanEval instances across 25 random single edits. Table 2 gives only component lengths (docstring 129.0, solution 174.1 tokens) and no total prompt length.
