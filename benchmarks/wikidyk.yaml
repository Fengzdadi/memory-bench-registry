  notes: 77,180 QA pairs over 12,290 facts from Wikipedia DYK entries (Jan 2022 to Apr 2025), covering reliability, generality, paraphrase, portability and locality. There are no dialogues. Facts are injected into model weights by continued pre-training. Table 4's main results inject the full dataset, while Fig. 2 and Sec. 5.3 use subsets of 100, 1,000 or 3,500 facts. Context length is not reported.
metrics:
- Substring match accuracy (Match)
- Token-level F1
- 'Reported per dimension: reliability, generality, paraphrase, portability, locality'
judge_model: null
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: 'arXiv has only v1 (2025-05-18). The ACL 2026 version is ACL Anthology 2026.acl-long.771. HF YWZBrandon/wikidyk (Apache-2.0, not gated) has 12,290 rows, one per fact, with per-dimension questions in a JSON ''eval'' field. The repo''s eval scripts instead read a JSON file from YWZBrandon/wikidyk_exp. Questions were generated by LLMs (GPT-4o, GPT-4.1, o3-mini). Running the evaluation first requires training: facts are injected by continued pre-training using 8-GPU scripts. The benchmark is designed to be extended with new DYK entries.'
