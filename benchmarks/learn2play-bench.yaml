  notes: 'questions = 20 game instances, one pinned seed per game template: 10 fixed and 10 re-shuffled games, 5 of them challenge games. Each configuration plays 3 independent trials of 5 episodes (normal games) or 10 (challenge games), giving 375 scored episodes (project website). The paper reports no dialogue count and no context length. The human study has 21-30 participants per game.'
metrics:
- Max (average over trials of peak normalized terminal score)
- Mean (average normalized score across evaluated episodes)
- 'Learning Gain (LG: mean of last k_g episodes minus mean of first k_g episodes, k_g = min(3, floor(T_g/2)))'
- 'Learning Slope (LS: slope of a linear fit of mean normalized score on episode index)'
- LS drop (Control LS minus Re-shuffled LS, RQ4 transfer)
- Mean cost per episode (RQ5)
