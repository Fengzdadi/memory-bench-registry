  notes: 'conversations = 92 task sequences: 32 correlated, 30 orthogonal and 30 implicit-intent (v3 §4.3.4). questions = 32 atomic tasks: 12 Easy, 18 Normal, 2 Hard. Table 1 instead gives 12/18 Easy/Normal sequences for each of Correlated, Orth-Same and Orth-Similar. The experiments use only the Easy sequences. arXiv v1 described a different set: 30 atomic tasks, a 120-task streaming pool, 45 step-changes and 30 preference instances.'
