- Success Rate (SR)
- Token Consumption (T/TC, mean K tokens per sequence stage)
- Token change rate (R3 vs R1, A2/A3 vs R1; median per agent)
- K_eff(Evo)
- K_eff(Conv)
- K_trans
- K_eff(Stab-Id)
- K_eff(Stab-Sim)
- K_eff(Ret)
- Normalized composite score (Median-AVG / Mean-AVG over 8 dimensions)
