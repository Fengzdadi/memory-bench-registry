name: GoodAI LTM Benchmark
slug: goodai-ltm-benchmark
release_date: 2024-09
venue: NeurIPS 2024 (Datasets and Benchmarks Track)
memory_types:
- conversational_longterm
- semantic_knowledge_update
- episodic
links:
  paper: https://arxiv.org/abs/2409.20222
  code: https://github.com/GoodAI/goodai-ltm-benchmark
  data: null
scale:
  conversations: 1
  questions: 33
  avg_context_length: 2k / 32k / 120k / 200k / 500k-token memory span (one per configuration)
  notes: 'Each benchmark run is one long conversation. A run has 33 scored tests (11 scenarios x 3 repetitions), and some tests contain several questions. There are six configurations: Isolated (no interleaving) and 2k/32k/120k/200k/500k memory spans. Scores are out of 11, or out of 10 at 2k, where ChapterBreak is omitted. No average conversation length is reported.'
metrics:
- 'Score: per-scenario scores normalized to [0,1] and summed (max 11; max 10 for the 2k span)'
- Standard deviation of score (std)
judge_model: GPT-4 Turbo
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: The paper calls it the "LTM Benchmark"; the repo README titles it "GoodAI LTM Benchmark". Paper results use Benchmark 3; the repo also has v1/v2 legacy configs. Tests are generated by code, and pre-generated definitions and results are in data/tests. The smallest v3 config is named 1k in the repo but reported as 2k in the paper. The README cites a root run_benchmark.py, but the file is runner/run_benchmark.py. Evaluation needs the OpenAI API. Licence is MIT; GPT-generated tests are non-commercial.
sources:
  name: Repo README title 'GoodAI LTM Benchmark'; paper §1 'we introduce the LTM Benchmark'
  release_date: 'arXiv API: 2409.20222v1 published 2024-09-30'
  venue: NeurIPS proceedings page (Advances in Neural Information Processing Systems 37, Datasets and Benchmarks Track); arXiv comment 'Accepted as a poster at NeurIPS D&B Track 2024'; README bibtex (openreview twFlD3C9Rt)
  memory_types: 'Paper §3.2 skill taxonomy: Recall, Conflicting information (Colours/Name list/Shopping list updates), Episodic memory (Jokes, temporal addressing); one long interleaved user-agent conversation (abstract, §2)'
  links.paper: arXiv abs 2409.20222
  links.code: 'Paper §1 footnote 1 and Appendix E: github.com/GoodAI/goodai-ltm-benchmark'
  links.data: Paper Appendix E names GitHub as the only host; no Hugging Face dataset; data lives in the repo (data/tests)
  scale.conversations: 'Paper §2/§3.1: benchmark engages agents in ''a single, prolonged conversation''; every test takes place in the same conversation'
  scale.questions: 'Paper §4: ''A benchmark run consists of 33 tests (11 scenarios and 3 repetitions each)''; Appendix F: 11 tasks, 3 examples each'
  scale.avg_context_length: 'Paper §4/Appendix D: memory spans 2k, 32k, 120k, 200k, 500k tokens plus Isolated; repo configurations/published_benchmarks/benchmark-v3-*.yml (memory_span: 500000 etc.)'
  scale.notes: Paper §4 and Table 1 caption (out of 11, 2k out of 10); Appendix D (ChapterBreak omitted at 2k)
  metrics: 'Paper Table 1 columns: Score and std per configuration; §4: scores normalized to [0,1], same-scenario scores averaged'
  judge_model: 'Paper §5 and Appendices A.2.1/A.3.1/A.8.1/A.9.1: evaluation ''powered in some parts by GPT-4 turbo'' (Jokes, Locations directions, Restaurant, Trigger response fallback); other tasks rule-based. Repo dataset_interfaces/interface.py evaluate_correct_gpt_impl uses model=''gpt-4-turbo'''
  repro_level: Repo has runner/run_benchmark.py (click CLI with -c config, -a agent, -m, -i isolated), evaluate.py, configurations/published_benchmarks/benchmark-v3-{1k,32k,120k,200k,500k}.yml, and pre-generated definitions in data/tests/Benchmark 3 - */definitions (checked 2026-10-10)
  notes: Repo README (versions, licence, non-commercial GPT-generated tests); repo tree (runner/run_benchmark.py, data/tests/Benchmark 3 - 1k); LICENSE file MIT
