  notes: '700 = processed Chinese MedQA-derived simulated outpatient cases (each run as one interactive episode and scored once). Splits: 500 longitudinal-stream cases (ten 50-case stages; conditions E0-E3), 100 held-out transfer cases (H0/H3), 100 cross-sectional cases (80-case model-comparison subset). A 100-episode MDT study is also reported. The artifact reportedly adds 3,103 trajectories and 3,386 step samples.'
metrics:
- Outcome score S = 0.5*diagnostic quality + 0.3*evidence consistency + 0.2*management quality
- Strict diagnostic accuracy
- Pass rate (S >= 0.7)
- Utility U (0.6*S minus turn, test and invalid-test cost terms)
- Interaction turns
- Examinations requested
- Invalid-test rate
- Learning gain (LG, late minus early stage mean)
- External/held-out transfer (ET = H3 - H0)
- Backward transfer (BWT)
judge_model: null
repro_level: paper_only
