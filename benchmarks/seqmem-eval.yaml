  notes: questions = sum of Table 6 sequential-test sizes (HumanEval 132, MATH500 500, MMLU-Pro-Engineering 873, MMLU-Pro-Physics 1170, APIBench-HF 911, ALFWorld 140). ID hold-out sets total 681 (32/280/96/129/120/24). Appendix C.2 adds OOD hold-out on AIME2024, AIME2025 and MMLU-Pro-Physics using MATH500-stream memory. Task streams, not conversations; no context length reported.
