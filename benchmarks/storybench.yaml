  notes: 86 = choice nodes (decision points) in one branching story graph that also has 311 scene nodes, transcribed from the game The Invisible Guardian, prologue to Chapter 5. There are two modes, Immediate Feedback and Self Recovery. Each model gets 10 trials per mode. Self Recovery is split into an original phase and an improved phase of 5 trials each. The paper reports '80+ branching story paths'.
