  notes: questions = 310 linked lifecycle cases (Code & Science 113, Daily Life 107, Office Work 90) from 48 contexts with 6-10 cases each. Each case compiles into Write, Execute and Forget stage tasks, 930 in total. The paper reports no conversation count or context length. Main results cover 24 harness x backend x LLM configurations, each run on all 310 cases. A Chinese mirror of the corpus exists.
metrics:
- Memory Poisoning Success Rate (MPSR)
- Memory Exploitation Success Rate (MESR)
- End-to-End Attack Success Rate (E2E-ASR)
- Selective Repair Success Rate (SRSR)
- Per-checkpoint pass rates (W1 Write Operation, W2 Persistence, E1 Recall Exposure, E2 Adoption, E3 Externalization, F1 Repair, F2 Benign Preservation)
judge_model: DeepSeek-V4-Pro
repro_level: paper_only
repro_checked_at: '2026-10-10'
run_records: []
notes: The arXiv v1 paper gives no code or data link. As of 2026-10-10 none was found on GitHub, Hugging Face or alphaXiv, although the paper mentions a released case-authoring Skill and released cases. GPT-5.5 authored the cases under human review. Experiments use the English task packages; a Chinese mirror also exists. Running the benchmark needs Docker, the OpenClaw/Hermes harnesses, the Mem0/Mem0-Graph/A-MEM backends and simulated services (web gateway, Mailpit, GitLab). Each configuration-case pair was run once.
