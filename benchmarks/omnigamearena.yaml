  notes: 'Not a QA set: 12 UE5 games (7 Solo, 3 PvP, 2 Coop). Cold start: N=5 episodes per (agent, game), 12 agents, PvP over all pairings. IDC (arXiv v1): LastStand and SharedFloor, R=10 rounds x K=5 episodes, 4 agents, 3 held-out variants per game. Released environment: 60 maps (origin + Var1-Var4 per game).'
metrics:
- Normalized game progress score in [0,1] (per-game formulas, Table 1)
- PvP Player-1 win rate over all pairings
- IDC round score S_r (mean episode score per round) and curve [S_0..S_R]
- Transfer gain V_best - V_0 and % change on held-out variants
- Actions per episode and score per action (PDQ vs LCRT, appendix)
judge_model: null
