- S3 Pass@1 (executable hidden oracle)
- final_passed
- RepeatedErrorRate
- HarmfulMemoryRate
- RegressionAfterUpdate
- ContradictionRepairAccuracy
- HumanFeedbackUseAccuracy
- UsefulMemoryPrecision
- ScopeAccuracy
- TransferScore
