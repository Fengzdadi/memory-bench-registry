scale:
  conversations: 60
  questions: 60
  avg_context_length: 3 sessions per sequence
  notes: '60 = admitted three-session trap sequences in the v2 confirmatory fold (S1/S2 inject evidence, S3 trap); questions = their 60 S3 trap tasks, each run with 3 seeds (180 S3 cells per condition). Historical v1 fold: 22 sequences (66 cells). The 60 include 22 v1 and 8 synth-pilot traps, labelled C1-C10 constructs. Public file has 60 lines (counted 2026-10-10).'
