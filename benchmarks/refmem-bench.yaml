scale:
  conversations: 35
  questions: 20279
  avg_context_length: 27,387.77 words (2,030.34 turns) per context
  notes: '35 curated long-horizon contexts (1,341 sessions, 71,062 turns, 1,124 images). 20,279 is the test split used for evaluation. The full benchmark has 26,449 QA: 6,170 train plus the test split, divided at the evidence-cluster level. By format: 8,688 MC, 6,812 SC and 10,949 DA, across eight dimensions.'
metrics:
- Answer accuracy (Acc; exact option-set match for single-/multi-choice, LLM judge for direct-answer)
- Memory recall (MemR; semantic evidence matching for text dimensions, evidence-index overlap for visual dimensions)
- BLEU-1 (direct-answer only)
- Token-level F1 (direct-answer only)
judge_model: GPT-4o (gpt-4o-2024-08-06)
repro_level: paper_only
repro_checked_at: '2026-10-10'
run_records: []
notes: 'New QA built over conversations from REALTALK, DialSim and LoCoMo. Questions require inferring latent user states and patterns rather than explicit recall. Images enter the evaluation prompts as captions ([Image #N Caption]). Raw images are not passed in. As of 2026-10-10 no code or data is public. The paper says code will go on GitHub and the dataset will be released under CC BY 4.0. The paper also proposes the REMIND method.'
