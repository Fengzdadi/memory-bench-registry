  notes: One fictional user over six months (March to August 2026); 599 sessions across typed chat, voice, a remote phone channel, inbound texts and emails, meetings and web pages. 2,080 probes in 15 areas; 1,040 dev probes are public, and the 1,040 test probes are private and scored by the maintainers (counted from README on 2026-11-10).
metrics:
- overall score (mean pass rate over areas)
- safety score (1 minus the worst leak rate across forget, scope and poisoning)
- leak rate per area (forget, scope, poisoning)
- silence junk rate
- remote over-block rate
- mean context tokens
judge_model: claude-opus-5-5
repro_level: official_script
repro_checked_at: '2026-11-10'
run_records: []
notes: 'No paper. Black-box: any memory system plugs in through a Python adapter; claude-sonnet-5-5 answers from what the system injected and claude-opus-5-5 judges. 15 areas include forgetting on request, channel scope, poisoning, silence, attribution and abstention next to recall. The maintainers also make Dawnmere, which is one of the scored systems. Licence: Apache-2.0 code, CC BY 4.0 data.'
