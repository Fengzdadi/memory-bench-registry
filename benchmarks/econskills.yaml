  notes: questions = 360 EconWebArena live web tasks used in the full-library study (BASE/ALL50/RETR5/RAND5/HINT30, one run each). 150 of them have a direct family match. The controlled transfer study uses 100 held-out variants (2 per skill) x 3 conditions x 3 seeds = 900 episodes. The library holds 50 skills from 50 solved seed tasks. There are no conversations.
metrics:
- 'Success rate (native EconWebArena reward: answer contains gold value and final URL on authoritative domain)'
- Mean interaction steps (compared only on paired successes)
- McNemar's exact test on paired outcomes (significance)
