run_records: []
notes: Suite of three subsets (Terminal-Bench-Evo, SWE-Chain-Evo, PersonaMem-Evo) released with the EvoMem method; the terminal and SWE subsets need Docker. Paper App. E.4.4 gives SWE-Chain-Evo as 48 chains/26 repos/135 milestones, which conflicts with the main text and the HF release (50 chains/12 repos/493). As of 2026-10-10 the repo has runners for PersonaMem-Evo and Terminal-Bench-Evo only (the SWE-Chain-Evo folder is unreleased) and no licence file. Its README dataset link (datasets/Aiden0526/EvoArena) does not resolve; the data is in the HF collection.
sources:
  name: 'arXiv title ''EvoArena: Tracking Memory Evolution for Robust LLM Agents in Dynamic Environments''; repo README'
  release_date: 'arXiv API: 2606.13681v1 published 2026-06-11T17:59:59Z (v2 updated 2026-06-17)'
  venue: arXiv API entry has no journal_ref/comment; repo README and HF bibtex say 'arXiv preprint arXiv:2606.13681'; project page (docs/index.html) names no venue (checked 2026-10-10)
  memory_types: 'Paper §3.1-3.3, §4.4 and App. E.1.1/G. Terminal-Bench-Evo: version chains run in order, with memory from earlier versions reused on later evolved tasks (procedural_workflow, plus overriding stale knowledge as semantic_knowledge_update). SWE-Chain-Evo: sequential milestone tasks, with OpenHands memory of prior trajectories (coding_cross_session). PersonaMem-Evo: MCQs over long chat histories with evolving or conflicting user preferences (personalization, conversational_longterm, semantic_knowledge_update).'
  links.paper: arXiv abs page; repo README Paper badge
  links.code: paper front matter \codeurl https://github.com/Aiden0526/EvoArena (owner Aiden0526 = first author Jundong Xu per HF profile)
  links.data: paper front matter \dataseturl https://huggingface.co/collections/Aiden0526/evoarena. The HF collection API lists Aiden0526/PersonaMem-Evo, Aiden0526/SWE-Chain-Evo, wufeiwu/Terminal-Bench-Evo and zhiyuanhucs/SWE-EVO-50chain-images; all are public and ungated (checked 2026-10-10)
  scale.conversations: paper §3.3 and Table 2 ('Persona conv. 10'); HF PersonaMem-Evo README (10 personas, 10 chat_history_32k files)
  scale.questions: paper §3.3, Table 2 and Table 17 (505 questions); HF personamem-evo-10p.csv has 505 rows across 10 persona_ids (counted 2026-10-10)
  scale.avg_context_length: 'paper §3.3 and Table 20 (tokens per persona: median 174,684, mean 178,292; median 597 messages); Table 2 labels 174.7K as ''Avg conv. length'''
  scale.notes: paper Table 2, §3.1-3.3 and App. E.2.4 (Table 12); HF SWE-Chain-Evo README; chain_id groups counted in the HF CSV on 2026-10-10
  metrics: paper §5.1 'Evaluation' and Table 3 (Step Acc., Chain Acc.); Table 6 (PASS_TO_PASS failure rate); Table 8 (clause-/row-level evidence capture)
  judge_model: EvoArena scoring uses executable tests (Terminal-Bench-Evo verifier reward; SWE-Chain-Evo F2P/P2P tests) and MCQ correctness (PersonaMem-Evo). The only LLM judge, gpt-5.4-mini, appears in the auxiliary GAIA experiment (App. G.4), which is not part of EvoArena.
  repro_level: Repo tree has EvoMem-PersonaMem-Evo/test_persona_robust.py, test_persona_patch.py, scripts/run_persona_baseline_patch.sh and scripts/evaluate_persona_chain_acc.py. It also has EvoMem-TerminalBench-Evo/harbor_EvoMem/scripts/run_chain.py, launch_terminus2_baseline.sh, launch_terminus2_evomem.sh and status.py (computes accuracy from verifier reward). The data is public on HF (checked 2026-10-10). There is no SWE-Chain-Evo runner yet.
  notes: Paper App. E.4.4 (Table 14) vs §3.2/Table 2. HF SWE-Chain-Evo README. Repo tree and README ('will contain' for SWE-Chain-Evo; license 'will be added'). The HF API for datasets/Aiden0526/EvoArena returned an error (checked 2026-10-10).
