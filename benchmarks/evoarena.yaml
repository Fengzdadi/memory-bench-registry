scale:
  conversations: 10
  questions: 505
  avg_context_length: ~174.7K tokens
  notes: 'conversations=10 persona chat histories, questions=505 four-way MCQs (PersonaMem-Evo; paper lists 313 preference chains, released CSV has 386 chain_id groups). Terminal-Bench-Evo: 89 chains, 441 versioned tasks (352 evolved). SWE-Chain-Evo: 50 chains, 493 chain-step instances (145 unique milestones). Context = median tokens per persona history (mean 178.3K; median 597 messages).'
metrics:
- Step accuracy
- Chain accuracy
- Pass-to-Pass regression failure rate (SWE-Chain-Evo analysis)
- Clause-/row-level preference evidence capture (PersonaMem-Evo analysis)
judge_model: null
