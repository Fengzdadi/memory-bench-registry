notes: 'No official code or data release found as of 2026-10-10: the paper links none, and GitHub and Hugging Face searches returned nothing. Tasks are headroom-filtered subsets of BigCodeBench-v0.1.4 and WildToolBench. Task relations come from a one-shot ICL gain matrix voted on by DeepSeek-V4-Flash, GPT-5.4-mini and GLM-5.0. All evaluated agents use DeepSeek-V4-Flash. FWT/BWT/FGT come from repeated probe tasks rather than full re-evaluation. The paper also proposes the SEU harness.'
