  notes: 'questions = 194 code prompts (100 SALLM Python + 94 CWEval JS/C++/C/Go), each paired with one insecure-preference memory prompt. Each prompt gets 3 completions in separate sessions (582 outputs per system per condition). Subsets: 17/14 paraphrased prompts (RQ3.2) and 29/28 mitigation prompts (RQ4). There are no multi-turn dialogues, and context length is not reported.'
