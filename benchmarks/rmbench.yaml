  notes: 'Not a dialogue/QA benchmark. It has 9 simulated manipulation tasks: 5 M(1) and 4 M(n). Each policy trains on 50 demos per task and is evaluated on 100 rollouts per task, so 900 rollouts in total. Real-world: 3 tasks with 100 demos and 40 trials each. The paper gives no episode length. Repo step limits range from 250 to 3500 steps per task.'
