  judge_model: 'no LLM judge: correctness is test-based (FAIL_TO_PASS / PASS_TO_PASS, §2.2.6); GPT-4o-mini appears only inside the Mem0/LangMem baselines for memory extraction (App. A.2)'
  repro_level: repo has evaluation.sh (subsets lite|multilingual|verified|full) calling swebench_memory/harness/combine_instances.py and swebench_memory/harness/run_evaluation.py; task cases in cases/ and data on HF; Docker Hub jiayuanz3/swecontextbench lists 358 tags (checked 2026-10-10)
  notes: arXiv v1 HTML §2.3 (300/99 Lite only) vs v2 abstract / v3 Table 1 (1,100/376); GitHub API license null; repo tree has 'cases/SWEContextBench Lite Past Experience' (300 .jsonl) only
