notes: arXiv v1 (Feb 2026) covered only the Lite set (300 base / 99 related tasks); v2/v3 expand to 1,100 base / 376 related tasks across 51 repos. The released data (HF, MIT; GitHub repo has no licence file) has 1,007 experience and 362 related rows (357 unique IDs) across 53 repos, counted on 2026-10-10. Only the Lite past-experience trajectory pool (300 JSONL) is released. Scoring is test-based and uses Docker Hub images.
sources:
  name: arXiv 2602.08316 title/abstract ('SWE Context Bench'; benchmark named SWE-ContextBench throughout) and repo README
  release_date: 'arXiv API: 2602.08316v1 published 2026-02-09T06:44:45Z'
  venue: arXiv abs page v1-v3 has no comments/journal_ref; repo README and HF card cite only the arXiv paper; web search found no venue (checked 2026-10-10)
  memory_types: 'paper v3 §2.2.2, §3.1: trajectories from 1,100 experience tasks form a context pool; 376 related tasks run ''in a fresh environment'' with retrieval from the pool only, no state carryover; Tables 3-5 measure how reusing prior-task trajectories/summaries (oracle/free, Mem0, OpenViking, LangMem, Supermemory) changes resolution, runtime and cost on later related coding tasks'
  links.paper: arXiv abs 2602.08316
  links.code: 'GitHub jiayuanz3/SWEContextBench: owner name ''Jiayuan Zhu'' (first author and arXiv submitter); README links arXiv 2602.08316 (repo not linked in paper text)'
  links.data: 'HF API jiayuanz3/SWEContextBench: not gated, license mit, tag arxiv:2602.08316; card links the GitHub repo; data/*.parquet (5 files)'
  scale.questions: 'paper v3 Table 1 and §2.2.5: 1,100 experience tasks + 376 related tasks = 1,476; §2.3 Lite 300/99'
  scale.avg_context_length: 'paper v3 §3.3: ''full context trajectories average 25,633.7 tokens''; summaries 217.1 tokens'
  scale.notes: 'HF parquet row counts on 2026-10-10: Experience 1,007; Related 362 (357 unique instance_id); Lite_Experience 300; Related_Lite 99; Relationship 362; README states 1,007/362 across 53 repos'
