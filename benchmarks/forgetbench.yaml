run_records: []
notes: 'The paper evaluates sequential knowledge editing (MEMIT, WISE, AlphaEdit, UltraEdit; settings from EasyEdit2) on Llama-3 8B, Llama-3.1 8B, Qwen-2.5 7B and DeepSeek-R1 7B. The data is synthetic: scenario QA comes from simulated Qwen2.5-32B agents plus an LLM that writes the questions. The abstract states "Code will be released upon acceptance." As of 2026-10-10 no official code or data was found. The GitHub repos named ForgetBench (kamaalg, Joel-Arpith, llaa33219) are unrelated projects.'
sources:
