  notes: '6,431 = total question instances over both settings: concept-based QA (profiles from a 2,500-name pool) and scenario-based multiple-choice QA (from 2,500 subgraphs of a 56,095-node agent-interaction graph). The paper does not give the per-setting split, which it defers to supplementary material that is not in arXiv v1. Edit sequences run up to T=500, evaluated every k=10 edits.'
metrics:
- ES (Edit Success)
- Ret (Retention)
- Δ1/2 (memory half-life)
- AUF (Area Under the Forgetting Curve)
- Speed (Forgetting Speed)
- TC (Temporal Consistency)
- 'Gen (Generalization: paraphrased minus original query accuracy)'
- 'Flu (Fluency: ratio of valid lexical tokens)'
