  notes: 802 unique verifier-checkable tasks in 17 harness streams (3-6 cumulative stages), instantiated as 1,510 axis-specific examples (tools 799, skills 353, agents 358). There are 520 tools, 42 skills and 62 agents. Each stage has disjoint adaptation and held-out test splits. EnterpriseOps-Gym and Agents' Last Exam sources. Not conversational.
metrics:
- Pass (%)
- Score (average verifier score, partial credit)
- Overall pass rate
- Forward Transfer (FWT)
- Backward Transfer (BWT)
- Time (h)
- Tokens (M)
- Delegation precision/recall/exact match (agents axis)
- Skill engagement rate
judge_model: null
repro_level: data_public
repro_checked_at: '2026-10-10'
run_records: []
notes: Tests harness evolution (tools/skills/agents). Memory is tested through the self-evolving adaptation setting, which compares baselines such as ReasoningBank, G-Memory and LEGOMem. No official code repo. HF data (Apache-2.0, ungated) is published as ZixuanKe/evovling_tools, evovling_skills and evovling_agents ("evovling" is the published spelling). Per the project page, scoring needs the authors' hosted API service. The HF tools set is larger than the paper's sample (README says 4,482 EOG tasks). The project page also lists seed benchmarks the paper does not use.
