  notes: 161 = multi-session task instances (paper §2.3), matching the 161 rows of the HF scenarios.jsonl test split. The paper reports no session or turn counts. The HF file holds 472 seeded prior sessions (1-5 per task, 89 users), and 37 tasks include images (counted 2026-10-10). Each task runs for 3 trials.
metrics:
- DB State (final database state matches goal)
- Output (response satisfies user request; information coverage)
- Tool Recall (correct tools in correct order)
- Task success (all three satisfied)
- Pass@3
- Pass^3
judge_model: null
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: 'Agentic benchmark: past sessions are seeded into memory, then a tool-using agent (26 restaurant-domain tools, PostgreSQL in Docker) serves an LLM-simulated user (Qwen3.6-35B-A3B in the paper). The paper does not name the model behind the LLM-judged Output metric; the repo defaults to gpt-4o-mini and the sample config uses gemma-4-31b-it. The paper states a CC-BY-SA dataset licence, but the HF card says CC-BY-4.0. Images ship separately (images.zip). Unrelated to the MEMENTO entry.'
