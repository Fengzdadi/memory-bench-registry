  avg_context_length: 3,238 tokens per session (avg, cl100k_base)
  notes: 'conversations = 2,029 long dialogue sessions built by merging ToolACE, BFCL and OASST1 conversations (abstract, §3.4.2, Table 1). questions = 400 memory-dependent tool-use tasks (abstract, §3.4.2, Table 1 ''QA pairs''). The experiments (§4.1) do not use all 2,029 sessions. They use a 429-session subset that keeps only histories containing the QA evidence. This subset matches the repo''s toolmembench_small/ folder (429 sessions, 400 QA, avg 3,422.5 tokens/session, 1,468,262 tokens total). The full folder Mem2ActBench/ has 2,029 sessions with 6,569,928 tokens total and 1,185-15,834 tokens per session. That folder also contains a 400-line qa_dataset.jsonl, but it is a different file from the one in toolmembench_small/ (the files differ). The average session length is reported three ways: 12 turns (abstract), 13 turns (Table 1, §3.4.2) and 12.67 turns (repo benchmark_statistics.json). Table 1''s caption defines ''Tokens'' as a total over all sessions, but its value of 3238 equals the repo''s per-session average.'
metrics:
- F1 (parameter-level precision/recall)
- BLEU-1
- 'Tool Accuracy (TA: correct tool and all parameters match exactly)'
- Tool Selection Accuracy (TSA) (§5.1 Table 4, §5.4 Table 5)
- Exact Match (EM) (§5.4)
- Arg_F1 (§5.4)
- Slot Accuracy (per-argument exact match, §5.3 Fig. 4)
