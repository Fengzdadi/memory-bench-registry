  notes: 2,261 human-verified five-option multiple-choice QA pairs from 1,220 videos in 11 categories. Each pair is evaluated in w/o Tutorial, w/ Tutorial and w/ Tutorial (Long) settings. Streams have no dialogue unit, so conversations is null. The mean overall_duration in the HF SLVMBench.json is about 74 min (computed 2026-10-10).
metrics:
- Accuracy (%) via option-letter matching, overall and per sub-task (NSP, SO, SGP, PR, TC, SC, MD, CB)
- Delta / Delta_L (accuracy gain from tutorial over the w/o-Tutorial baseline)
- Wilson 95% confidence intervals (Long setting)
