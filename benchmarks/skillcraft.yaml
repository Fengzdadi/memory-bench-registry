  notes: '126 = tool-use tasks (21 task families x 6 scaled variants: 63 Easy, 42 Medium, 21 Hard; 3x3, 4x4, 5x5 entities x tool calls per entity). The repo matches (21 families, e1-e3/m1-m2/h1, counted 2026-10-10). There are no conversations. Modes: Base, Skill, Hierarchical, Cross-Task (Easy->Hard, Hard->Easy, Hard->Hard), and cross-model reuse.'
