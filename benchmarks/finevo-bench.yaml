name: FinEvo-Bench
slug: finevo-bench
release_date: 2026-08
venue: arXiv preprint
memory_types:
- procedural_workflow
links:
  paper: https://arxiv.org/abs/2608.06144
  code: null
  data: null
scale:
  conversations: null
  questions: 120
  avg_context_length: 6.46 input files per task (range 2–11)
  notes: 'questions = 120 open-ended multi-file tasks (20 business scenes × 6 cases, six financial domains; 775 input files in total). conversations is null because there is no dialogue data: the tasks run as three independently shuffled, globally interleaved 120-task streams, each paired with a state-reset control. avg_context_length counts input files; the paper reports no token length for inputs.'
metrics:
- 'Task quality: mean scene-rubric score (0–100)'
- 'Financial compliance: mean triggered compliance issues per task'
- 'Self-evolution gain: paired ΔScore and ΔComp. vs. state-reset (non-evolving) control'
- Early (within-scene ranks 1–3) vs. Late (ranks 4–6) paired score gain and compliance reduction
- Experience activation count and activated vs. non-activated score gap
- Per-dimension normalized score-rate gains (5 capability dimensions)
- Agent-side token cost (execution + reflection, 10^4 tokens/task)
judge_model: Claude Opus 4.6 (via a Claude Code rubric-scoring agent)
repro_level: paper_only
repro_checked_at: '2026-10-10'
run_records: []
notes: No official code or data release was found as of 2026-10-10. The paper links no repository or dataset, and Appendix B prints the pipeline code and prompts. This is a different benchmark from FinEvolveBench (arXiv 2606.06960, GitHub DavidDeng01/FinEvolveBench). v2 (2026-10-01) rewrote the abstract and replaced v1's five-scene, 30-task cross-scene diagnostic with full-benchmark scene isolation. The headline results did not change. All evaluated scaffolds use Qwen3.7-Max as the backbone.
