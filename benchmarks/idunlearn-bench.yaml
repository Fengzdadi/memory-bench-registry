  notes: '4,860 evaluation-only VQA probes (81 per individual) over 60 synthetic individuals, in 4 task families / 9 subtasks (AA 2,520; IA 1,320; IB 480; IR 540). There is also a separate 10,050-QA supervision set used to inject the profiles by LoRA fine-tuning, plus 1,442 images. Splits are by identity: Forget-1 and Forget-5, with the remaining identities as the retain set. These are single probes, not conversations.'
