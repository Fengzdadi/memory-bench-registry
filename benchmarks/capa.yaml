notes: CAPA = Cross-Session Adaptation to Personalized Ambiguity. Sessions are synthetic, generated in an LLM-simulated environment (AmbiSimu) from HumanEval tasks. The paper names no generator, simulator or judge model, but the repo's frozen data says the history dialogues are GPT-5.5. Models run without history and with same-user history. The paper links no code. Repo xuzijan/Synthetic-data is attributed to the first author (account name, results identical to Tables 1/3/5). It uses internal names (PACI-Bench, DialogRL v02), has no licence and commits no runner for the frozen data.
sources:
  name: 'paper abstract and Introduction: ''we introduce CAPA (Cross-Session Adaptation to Personalized Ambiguity)'''
  release_date: 'arXiv API: 2607.26611v1 published 2026-07-29 (only v1 exists)'
  venue: arXiv API shows no journal_ref or comment; the arXiv abs page lists only v1 with no comments; no venue is named in the paper
  memory_types: 'Benchmark Task section: CAPA evaluates whether a coding assistant can use a recurring user''s prior multi-turn coding sessions to resolve personalized ambiguity in a new session (coding_cross_session). Users are defined by a profile plus a personalized resolution pattern, and shuffled history from other users is compared with same-user history (Discussion, Table 3) (personalization).'
  links.paper: arXiv API entry for 2607.26611
  links.code: 'GitHub xuzijan/Synthetic-data, opened 2026-10-10 with gh api. Neither the paper (HTML/PDF) nor the HF papers API (githubRepo null) links it, so attribution to first author Zijian Xu rests on the account name and the content. The repo holds paper drafts for the same benchmark under its earlier name (paper/draft.md, ''PACI-Bench'') and DialogRL-v02-frozen-benchmark (60 cells, 600 records). The GPT-5.5 rows in multi_model_benchmark/gpt55/merged/summary_by_condition.csv match the paper''s GPT-5.5 results exactly: no_history 223/300 with FT 7 and TTC 4.4167; same_user_raw_history 253/300, FT 93, TTC 2.97; same_user_profile_gated 250/300, FT 133, TTC 2.7933; random_diff_pair 255/300, FT 87, TTC 3.01. These are the values in Tables 1, 3, 4 and 5. Gemini 3.5 Flash also matches Table 1. Last push 2026-07-18, before arXiv v1 (2026-07-29).'
  links.data: 'null: the benchmark data sits inside the code repo (DialogRL-v02-frozen-benchmark/) with no separate dataset page; HF datasets filter arxiv:2607.26611 returns [] (checked 2026-10-10)'
  scale.conversations: 'paper §Dataset statistics: ''600 coding sessions arranged into 60 balanced profile–ambiguity-pair cells'', 10 sessions per cell'
  scale.questions: 'abstract and §Dataset statistics: ''300 held-out evaluation sessions'' (5 per cell)'
  scale.avg_context_length: 'null: no token or turn-length statistic of the dataset is reported; only the 8-turn budget and reference-run mean turns (Appendix A)'
  scale.notes: paper §Dataset statistics and Appendix A (Figure 4); §Experimental Setup (eight-turn budget)
  metrics: 'paper §Experimental Setup: ES, FT-ES, TTC (Table 1)'
  judge_model: 'null: success is decided by a ''shared external execution-grounded judge'' that uses hidden HumanEval tests. The paper says this judge also assesses code against the reference solution but names no LLM for it (§Interaction Data Generation Pipeline, §Experimental Setup).'
  repro_level: data_public, from repo xuzijan/Synthetic-data (checked 2026-10-10). DialogRL-v02-frozen-benchmark/merged/ holds history_full_sessions.jsonl (300), holdout_questions.jsonl (300) and benchmark_records.jsonl (600) as plain JSONL, not LFS. holdout_questions.jsonl was downloaded and has 300 rows over 60 cells, with ground_truth and evalplus_task_id. No committed script runs the paper's evaluation on this package. Only scripts/evaluation/export_v02_frozen_benchmark.py references it. The multi-model runs' work_dir (multi_model_benchmark/_raw_runs) and their runner are not committed. The older runners (scripts/evaluation/run_mixed_20cell_history_probe.py, run_llm_only_60cell_*.py) default to earlier output/ dirs and condition sets.
  notes: arXiv HTML v1 §Interaction Data Generation Pipeline and §Experimental Setup; HF papers API; repo xuzijan/Synthetic-data (README.md, DialogRL-v02-frozen-benchmark/README.md + manifest.json, paper/draft.md, multi_model_benchmark/*/merged/summary_by_condition.csv; repo API licence null)
