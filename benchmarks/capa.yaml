  notes: '60 = user-ambiguity cells (user trajectories), 10 sessions each, 600 coding sessions in total. In each cell, 5 resolved sessions form the history and 5 are held out. 300 = held-out evaluation sessions, solved under an 8-turn budget. Held-out difficulty, from a no-history reference run: 97 simple, 89 medium, 114 complex. The tasks derive from HumanEval. The paper does not report token or context length.'
