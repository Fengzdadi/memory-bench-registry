scale:
  conversations: 50
  questions: 1000
  avg_context_length: 20,000–50,000 tokens per document (avg. 4.0 documents per micro-world) plus 5 sessions of ~10.6 utterances
  notes: 'conversations = 50 micro-worlds (5 multi-party sessions each, 250 sessions total, 3–5 personas); questions = 1,000 QA pairs (20 per world). Splits 35/7/8 worlds = 700/140/160 QA. All reported baselines use only the 160-QA test split. Source tags: Hybrid 751, Chat-only 136, Doc-only 113. Five categories with 200 QA each. No overall per-world token total is reported.'
metrics:
- Token-level F1 (primary; by source tag and category)
- Exact Match (defined, omitted from main tables)
- Abstention Accuracy (Adversarial questions only)
judge_model: null
repro_level: paper_only
repro_checked_at: '2026-10-10'
run_records: []
notes: The paper says the dataset, pipeline and baselines are released. arXiv v1 gives no repo or data link, and none was found on GitHub or Hugging Face as of 2026-10-10. Legal domain only (Caselaw Access Project). Conversations and QA are generated by Claude Sonnet 4.6. Baselines answer with Claude Sonnet 4.5. An LLM judge (Claude Sonnet 4.6) is used only for dataset quality checks (median κ=0.634), not for scoring. Table 3 lists a 790-document pool, while Figure 2 shows 200 docs.
