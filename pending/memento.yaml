  notes: '438 embodied episodes in 12 HSSD scenes (Habitat 3.0): 201 memory-acquisition episodes (89 object-semantics, 112 user-pattern), 201 single-memory utilization episodes (same split), and 36 joint-memory utilization episodes (12 object-semantics pairs, 12 user-pattern pairs, 12 mixed pairs). These are tasks, not dialogues, so the conversation count is left empty. The released JSON files match these counts (checked 2026-10-10).'
