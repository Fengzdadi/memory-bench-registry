name: SCALE-QA
slug: scale-qa
release_date: 2026-08
venue: EMNLP 2026
memory_types:
- conversational_longterm
- semantic_knowledge_update
links:
  paper: https://arxiv.org/abs/2608.25655
  code: https://github.com/LordTARN1SHED/SCALE-QA
  data: null
scale:
  conversations: 4
  questions: 3000
  avg_context_length: 128k tokens (main setting; configurable 16k–1M)
  notes: 3,000 four-option MCQs (10 domains x 300; splits codex/claude-code 1,500 each), each with a short item-level source dialogue. At 128k these are packed into 4 deterministic flat-thread batches (conversations=4); 16k–128k use the full set, 1M uses a stratified 400-question diagnostic. Token counts are benchmark-side estimates (about 1.3x whitespace words).
metrics:
- Accuracy (four-way MCQ, primary)
- CL Hit (closed-loop expected-evidence hit)
- Rationale similarity (BGE cosine, auxiliary diagnostic)
- Context tokens
- Latency
- All-evidence recall@5 (diagnostic)
judge_model: null
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: The arXiv comment says the paper was accepted to the EMNLP 2026 main conference. The repo is at v1.1.0 and its 3,000 records are the same as in v1.0. By default the runtime builder uses an UltraChat-derived noise pool (MIT) that does not reproduce the paper's noise stream. Exact reproduction requires rebuilding WildChat-derived noise (ODC-BY) locally and checking the paper's hashes. The data is CC BY 4.0 and the TSIM code is Apache 2.0. tsim_reference/src/eval/run_eval.py is only a stub-backend scaffold.
sources:
  name: 'arXiv abstract and repo README (SCALE-QA: Single-session Cross-domain Agentic Long-context Evaluation)'
  release_date: 'arXiv API: 2608.25655v1 published 2026-08-26 (v2 2026-09-29)'
  venue: 'arXiv comment on 2608.25655: ''Accepted to the Main Conference of EMNLP 2026''; not yet listed in ACL Anthology (searched 2026-10-10)'
  memory_types: 'paper §3.1–3.4: recall dormant constraints from a flat mixed-topic multi-turn assistant thread up to 128k/1M (conversational_longterm); §3.3 stress cues include state overwrite (a later turn supersedes a default), and runtime packages add stale constraints (semantic_knowledge_update)'
  links.paper: arXiv API entry 2608.25655
  links.code: paper §7 and 'Reproducibility artifacts' (arXiv v2 HTML) link https://github.com/LordTARN1SHED/SCALE-QA; repo maintained by first author Zhexi Feng
  links.data: data is distributed inside the GitHub repo (scale_qa_strict_valid_bundle.json); a Hugging Face API search for SCALE-QA/scaleqa found no official dataset
  scale.conversations: 'paper Appendix B: ''The main 128k comparison uses four deterministic batches'' (truth corpus ~393,245 tokens, truth-cap 0.82)'
  scale.questions: paper abstract and Tables 5–6; repo scale_qa_validation_report.json total_records=3000
  scale.avg_context_length: 'paper §3.4 and §5: 16k–128k full-dataset settings, main comparison at 128k, 1M diagnostic; Appendix B token estimate ≈1.3x whitespace word count'
  scale.notes: paper Tables 5–7, Appendix A.1, Appendix B; repo DATASET_CARD.md
  metrics: paper §5 ('We report Accuracy, CL Hit, context tokens, and latency'), Table 2 caption (rationale similarity), §6.6/Appendix E (all-evidence recall@5)
  judge_model: SCALE-QA uses deterministic four-way MCQ grading, so there is no LLM judge (paper §3.1, Appendix A). The GPT-4o judge is used only in the LongMemEval-S transfer diagnostic (Appendix E.2).
  repro_level: 'repo tree checked 2026-10-10: build_eval_dataset.py (runtime package builder) and tsim_reference/src/eval/original_main_runner.py (runs tsim/standard/raptor/memgpt/hipporag/tunedhybridrag/fullcontext over runtime packages and computes accuracy/hit rate). Data file scale_qa_strict_valid_bundle.json downloads via raw.githubusercontent.com (HTTP 200, 9.8 MB).'
  notes: arXiv comment; repo RELEASE_NOTES_v1.1.0.md, README (Noise Assets, License), LICENSE (CC BY 4.0), tsim_reference/LICENSE (Apache 2.0), tsim_reference/docs/reproduction_guide.md
