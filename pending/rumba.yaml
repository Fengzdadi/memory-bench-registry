name: RUMBA
slug: rumba
release_date: 2026-07
venue: arXiv preprint
memory_types:
- conversational_longterm
- episodic
- semantic_knowledge_update
- memory_security
links:
  paper: https://arxiv.org/abs/2607.21447
  code: https://github.com/ai-forever/RUMBA
  data: https://huggingface.co/datasets/ai-forever/RUMBA
scale:
  conversations: 85
  questions: 1543
  avg_context_length: ≈340,000 characters
  notes: 85 timestamped user-assistant dialogues (12-85 sessions and 180-998 utterances each) and 1,543 QA pairs (14-22 per dialogue, 17 base types). An aligned English translation has the same 85 dialogues and 1,543 QA pairs; both counts were checked in the HF jsonl files on 2026-10-10. Average length is ~341K characters for RU and ~321K for EN (Table 4). No token count is given.
metrics:
- LLM-as-Judge accuracy (primary; judge labels 2-3 count as correct)
- F1 (per-question bag-of-words F1, max over references)
judge_model: POLLUX (ai-forever/pollux-judge-32b) for Russian; DeepSeek-R1 for English
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: The main benchmark is in Russian, with an aligned English translation. Russian and English use different judges (POLLUX vs DeepSeek-R1), so their scores are not directly comparable. User turns were written by 26 human contributors and assistant turns were generated by GigaChat Max. Question types include UpdatingInfo and DeleteInfo ("forget it" requests). Dialogue length is reported in characters only. Repo and data are MIT-licensed. Each HF row embeds the full dialogue, so the files are about 0.98 GB (ru) and 0.54 GB (en). The mem0 baseline needs a paid mem0 account.
sources:
  name: 'arXiv title ''RUMBA: Russian User Memory Benchmark''; repo README ''Russian User Memory BenchmArk (RUMBA)'''
  release_date: 'arXiv API: 2607.21447v1 published 2026-07-23 (only version)'
  venue: arXiv abs page has no Comments or Journal-ref; the paper names no venue; README citation is @misc arXiv
  memory_types: 'paper §3.2/Table 2: long multi-session user-assistant dialogues (conversational_longterm); temporal axis with Ordering, DateExtraction and CalendarUnderstanding types (episodic); UpdatingInfo type for update tracking (semantic_knowledge_update); DeleteInfo type, where the user says ''delete this''/''forget it'' and the correct answer is ''There is no such information'' (memory_security, forgetting requests)'
  links.paper: arXiv API id 2607.21447; linked from repo README
  links.code: paper footnotes 2 and 6 link github.com/ai-forever/RUMBA; repo README links back to arXiv 2607.21447
  links.data: 'paper footnote 1 links huggingface.co/datasets/ai-forever/RUMBA; HF API: public, not gated, MIT, files rumba-ru.jsonl and rumba-en.jsonl'
  scale.conversations: paper Table 3 (85 dialogues); 85 unique user_id/conversation_idx in HF rumba-ru.jsonl and rumba-en.jsonl, counted 2026-10-10
  scale.questions: paper Tables 1 and 3 (1,543 Q-A pairs); 1,543 lines in each HF jsonl, counted 2026-10-10
  scale.avg_context_length: paper Table 3 'Average dialogue length ≈ 340,000 characters'; Table 4 RU 341,103.13 / EN 320,782.08 characters
  scale.notes: paper Table 3 (sessions 12-85, utterances 180-998, questions 14-22 per dialogue, 17 base types); §3.4 English subset
  metrics: 'paper §4.2: LLM-as-Judge accuracy as primary metric, F1 as complementary; repo custom_tasks/rumba_ru.py uses Metrics.f1_score and llm-judge-accuracy'
  judge_model: paper §4.2/Appendix E (POLLUX for RU, DeepSeek-R1 for EN); repo README 'LLM-as-a-Judge models'; rumba_ru.py judge_model_name='ai-forever/pollux-judge-32b'
  repro_level: repo tree (checked 2026-10-10) has evaluation/run_experiments_add.py (ingestion), evaluation/run_lighteval.py plus evaluation/lighteval_ext/custom_tasks/rumba_ru.py and rumba_en.py (eval, hf_repo='ai-forever/RUMBA'), and Makefile targets run-<framework>-lighteval-<ru/en>; data also in evaluation/data/data_locomo_format*.json and on public HF
  notes: paper §3 (contributors, GigaChat Max), §4.2; repo README (mem0 paid plan, separate judges); HF API file sizes; repo and HF licence MIT
