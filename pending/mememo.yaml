  notes: 'The paper gives no dialogue, session, question or token counts for HLME (checked text, tables and Figures 2-3 of arXiv v1). It has two versions: HLME-Medium and HLME-Large. The Large version adds noise and longer dialogues that exceed normal context windows. Section 6.1 calls it HLME-Long. The questions fall into 5 categories, and the emotion templates cover 49 EARL emotion categories.'
