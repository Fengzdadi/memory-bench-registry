notes: 'As of 2026-10-10, no official code or dataset was found. Places checked: paper PDF links, the arXiv page, the HF paper page (no linked datasets), MemTensor/IAAR-Shanghai GitHub repos, and GitHub/HF searches for MemEmo/HLME. The dialogues are synthetic and LLM-generated, seeded from PersonaHub personas. Systems are tested on memory frameworks (Mem0, Letta, MemOS, Mirix, MemoBase), not raw LLMs. The paper says six systems were evaluated but lists five. It also calls the large split both ''Large'' and ''Long''.'
