scale:
  conversations: 40
  questions: 541
  avg_context_length: ~48K tokens per persona (mean 744 tokens per session)
  notes: '541 instances (CPC 193, BOC 121, SCC 227) over 40 personas. The pipeline track gives each persona one multi-session history: 2,580 dialogue sessions in total, a mean of 64.5 per persona. The oracle track gives each instance 8-11 core memories plus 6 distractors, for 4,893 core memories and 3,246 distractors in total. D6 applies only to 62 high-risk SCC instances.'
metrics:
- D1 Conflict Perception (0-4 rubric)
- D2 Causal Reasoning (0-4)
- D3 Confidence Calibration (0-4)
- D4 Clarification Seeking (0-4)
- D5 Memory Faithfulness (0-4)
- D1-D5 total score (/20)
- D6 Commitment Appropriateness (safe/partial/unsafe flag on 62 high-risk SCC instances)
- Pipeline conflict observability (FULL/PARTIAL/NONE rate)
judge_model: GPT-5.4 and Claude Opus 4.7 (two independent judges, reported separately)
repro_level: paper_only
repro_checked_at: '2026-10-10'
run_records: []
notes: 'As of 2026-10-10 the paper (arXiv v1 only) links no code or data. No official GitHub repo or Hugging Face dataset was found, and Hugging Face has no paper page for it. There are two tracks: an oracle track with curated memory banks and a pipeline track that runs Letta, Mem0, A-mem and MemOS. Responses are scored by two LLM judges, with results reported separately. Table 1 gives context length as "744/48K", while §3.2 describes 744 tokens per session and ~48K per persona. The benchmark tests calibrated action under unresolvable conflict, not single-answer recovery.'
