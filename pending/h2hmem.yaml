  paper: https://arxiv.org/abs/2606.09461
  code: https://github.com/varib1/H2HMEM
  data: https://huggingface.co/datasets/varib/H2HMEM
scale:
  conversations: 25
  questions: 2236
  avg_context_length: 22.9 rounds/session; 12.4 sessions/dialogue
  notes: '25 dialogues (20 dyadic + 5 multi-party with 4-6 participants), 309 sessions, 7,078 dialogue rounds, 1,300 images; 2,236 QA pairs (2,046 dyadic + 190 multi-party) over 9 task types (UPR, CRR, KR, MCR, RET, TR, TTL, CD, AR), 618 with images. Dyadic: 18.7 rounds/session, 14.2 sessions; multi-party: 70.5 rounds/session, 5 sessions.'
metrics:
- LLM-as-Judge score (0/0.25/0.5/0.75/1 rubric; primary)
- Precision
- Recall
- F1
- BLEU-1
- 'Efficiency: storage time (s/session), retrieval and answer latency (s/query)'
judge_model: GPT-4o-mini
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: 'The dialogues are synthetic: DeepSeek-V3 generated them, and humans refined the images and QA pairs. All content is in English. There is a licence mismatch: the paper (App. C.1) states CC BY 4.0 for research use only, while the HF card and the README badge state MIT, and the GitHub repo has no LICENSE file. The HF release was counted on 2026-10-10. Its QA total (2,236) and utterance total (7,078) match the paper. However, it has 283 dyadic session.json files against the 284 sessions the paper reports: dyadic/dialogue3/session6 has questions and images but no session.json. A public leaderboard accepts submissions.'
