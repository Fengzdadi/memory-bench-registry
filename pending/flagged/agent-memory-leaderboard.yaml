  notes: 'Exact counts are not published. The README gives only approximate figures for the Textual track: more than 10 datasets, over 1,500 histories and tasks, and nearly 5,000 questions. The HF Space gives about 150M history characters in total. The Coding track has 12 repos, 150 base tasks (51 new-feature, 99 bug-fix) and 1,290 historical tasks. Coverage may change between leaderboard releases.'
metrics:
- 'Textual Memory: Overall score (micro-aggregated, published on a 0-100 scale) plus 7 capability-dimension scores (Fact Recall, Composition, Temporal, Governance, Personalization, Execution, Safety)'
- 'Per-dataset: LLM-judge binary accuracy (LoCoMo-Refined, LongMemEval-S), rubric-based LLM-judge score (BEAM, CL-bench), BEAM event-ordering tau_norm x F1, MCQ/option accuracy (PersonaMem, ScriptMem), PersonaMem-v2 judge score 0-1'
- 'Coding Memory: Task Solve (%), with New Feature and Bug Fix subsets'
- 'Efficiency labels: total/write/search time and return size'
judge_model: null
repro_level: paper_only
repro_checked_at: '2026-10-10'
run_records: []
notes: 'No paper exists; the README cites a @misc pointing to agentmemoryleaderboard.ai. AML is a submission-based leaderboard: participants expose Add/Search APIs and the organizers run answering and judging. The repo deliberately excludes corpora, held-out questions and gold answers, and the coding track is unreleased. Upstream datasets (LoCoMo, LongMemEval, BEAM, etc.) are public separately. A secondary site mentions a multimodal track that official sources do not confirm; the official website returned HTTP 522 on 2026-10-10.'
sources:
  name: repo README.md title 'Agent Memory Leaderboard' and text 'Agent Memory Leaderboard (AML) is an open evaluation platform...'
  release_date: 'No paper; repo README: ''AML was launched on July 29, 2026''; GitHub API created_at 2026-07-29 (repo AML-memory/agent-memory-leaderboard)'
  venue: 'No paper found: arXiv API searches (''Agent Memory Leaderboard'', README citation title, ''Agent Memory Challenge'', CAMBench) returned nothing; README citation is @misc with howpublished = agentmemoryleaderboard.ai; HF org lists numPapers 0'
  memory_types: 'README ''Evaluation at a glance'' + capability tables and HF Space data/generated/leaderboard_data.json categories: long conversations/cross-session history (conversational_longterm); Personalization ''Preference Recall & Personalized Following'' (personalization); Governance ''New-Value Overwrite & Current-State Resolution'', ''Contradiction Detection & Conflict Resolution'' (semantic_knowledge_update); Temporal ''Event Ordering & Phase Sequencing'' (episodic); Governance ''Deletion, Forgetting & Suppression'' + Safety ''Sensitive-Information Minimization & Privacy'' (memory_security); Coding Memory track ''reuse relevant engineering experience from earlier work in the same repository'', Debug Memory ''repair strategies, and validation workflows'', ranked by Task Solve (coding_cross_session, procedural_workflow)'
  links.paper: none exists (see venue)
  links.code: https://github.com/AML-memory/agent-memory-leaderboard linked from the official HF Space (agent-memory-leaderboard/leaderboard) README as 'AML GitHub repository'
  links.data: 'HF API: organization agent-memory-leaderboard has numDatasets 0 (only the static leaderboard Space); repo README: ''it does not contain benchmark data'''
  scale.conversations: 'null: README gives only ''over 1,500 histories and tasks'' (approximate)'
  scale.questions: 'null: README gives only ''nearly 5,000 evaluation questions''; HF Space index.html ''≈5K Text questions''; coding taskCounts {overall:150,newFeature:51,bugFix:99} in HF Space data/generated/code_leaderboard_data.json'
  scale.avg_context_length: 'null: only a total ''≈150M history characters'' on HF Space index.html; no average reported'
  scale.notes: repo README 'Evaluation at a glance' table; HF Space index.html and code_leaderboard_data.json
  metrics: HF Space index.html ('Textual Memory ranks by Overall; Coding Memory ranks by Task Solve (%)', 'total micro score'); README ('Published scores use a 0-100 scale'); leaderboard_data.json fields; repo data/*/pipeline.py (CORRECT/WRONG judge in locomo-refined and longmemeval-s; rubric judge + event_ordering_metrics in beam; binary rubric judge in clbench; option accuracy in scriptmem; boxed 0-1 score in personamem/pipeline_v2.py)
  judge_model: 'null: no paper; repo api_config.py reads JUDGE_MODEL from an environment variable with an empty default, and the pipelines override --model with it; HF Space mentions ''multi-agent judging'' without naming models (the answer base model for academic entries is GPT-4o mini per HF Space)'
  repro_level: repo tree (checked 2026-10-10) has evaluation scripts data/{beam,clbench,locomo-refined,longmemeval-s,scriptmem}/pipeline.py and data/personamem/pipeline_v1.py, pipeline_v2.py, but README states that benchmark corpora, held-out questions and gold answers are not published and the HF org has no datasets, so AML's evaluation data cannot be obtained; no paper exists, so paper_only is the closest allowed level
  notes: repo README 'Repository scope' / 'Deliberately not included' sections; HF Space README; curl to agentmemoryleaderboard.ai returned 522 on 2026-10-10; multimodal-track claim only on a secondary listing (everydev.ai)
