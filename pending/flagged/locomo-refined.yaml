notes: 'No paper exists: the README lists the technical report as ''coming soon'' (checked 2026-10-10), so every field comes from the GitHub repo. It modifies LoCoMo (Snap, ACL 2024), keeping the same 10 conversations. Of its 1,382 QA, 337 were revised after AI screening and a 5-annotator audit. The stricter refined judge (Qwen3-14B) scores lower than the original GPT-4o-mini judge, so results are not comparable with original LoCoMo scores. Licence: CC BY-NC 4.0. The README''s v1.0.0 release link has no matching GitHub release.'
