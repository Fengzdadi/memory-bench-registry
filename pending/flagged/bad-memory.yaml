  notes: 'The benchmark has no conversation or question items. The paper tests 3 adversarial goals under 3 session designs: a single probe, same-attack Probe→Stabilization→Probe chains (3 of them), and different-attack chains (6 ordered pairs). It runs 10 trials per cell on 4 models (Tables 1–5). Workloads are in testbed/workloads/ (Claude Code) and testbed/workloads_codex/ (Codex).'
