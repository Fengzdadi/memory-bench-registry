notes: This is a benchmarking study, not a new dataset. Fact-level data is ZsRE and WikiData_counterfact from KnowEdit (HF). Event-level data is ELKEN (THU-KEG GitHub). The math sets ship as LUFFY parquet files in the repo. The repo is an EasyEdit/LUFFY fork with hard-coded paths. Its SCR scripts call "Qwen2.5-72-Instruct" at a private IP endpoint, while EasyEdit's LLM-judge helper calls DeepSeek "deepseek-chat". The repo has no top-level licence. The paper extends arXiv:2503.05212 (SCR) by the same authors.
sources:
  name: arXiv API title of 2505.18690. The paper gives no acronym (it calls itself 'a comprehensive benchmarking study'). The repo is named Knowledge-Editing-Benchmark.
  release_date: 'arXiv API: 2505.18690v1 published 2025-05-24 (only v1 exists)'
  venue: arXiv API has no journal_ref (its only comment is an admin note about overlap with 2503.05212). The paper text gives no venue, and a web search found no conference or journal version.
  memory_types: 'Abstract: knowledge editing ''to update the embedded knowledge within LLMs'', comparing parameter modification with external memory integration. The paper evaluates 12 editing methods (ROME, MEMIT, AlphaEdit, etc.) against the context-based SCR/IKE/ICE methods under one protocol (parametric). It tests whether updated facts override prior knowledge, including via a retrieved external textual memory in SCR (semantic_knowledge_update).'
  links.paper: arXiv abs page 2505.18690
  links.code: Paper abstract footnote 1 links github.com/ECNU-Text-Computing/Knowledge-Editing-Benchmark. The repo description matches the paper title.
  links.data: Paper footnote 3 links huggingface.co/datasets/zjunlp/KnowEdit as the source of ZsRE/WikiData_counterfact (third-party, prior work). The HF API shows it is not gated, has an MIT licence, and includes benchmark/ZsRE/ZsRE-test-all.json and benchmark/wiki_counterfact/test_cf.json. ELKEN comes from github.com/THU-KEG/Event-Level-Knowledge-Editing (paper footnote 4; data/original/test.json present).
  scale.questions: 'null: the paper gives no count for the main evaluation set. arXiv v1 HTML §4.1 ''Sequential Editing Scenario'': ''For each dataset, we edit each knowledge item in sequence'' (Table 2 uses the full datasets; the Fig. 2 caption''s x-axis ends at ''the full dataset''). The ''100'' in §4.1 ''Metrics Calculation'' (''we select the first 100 knowledge items'') applies only to the 1/10/100-edit load analysis and the reasoning-LLM setting (Table 3). Re-checked 2026-10-10.'
  scale.notes: 'arXiv v1 HTML §4.1 (Sequential Editing Scenario; Metrics Calculation), §4.2 (Table 2, Fig. 2 caption, Table 3 text: ''100 counterfactual knowledge instances extracted from each of the two datasets''). Dataset section: ELKEN filtered to remove future-trend questions. Neither the paper nor Appendix B.1 gives counts for ELKEN or the math sets.'
  metrics: 'Paper §3/§4.1: Reliability, Generalization, Locality, Portability (accuracy %), with Avg in Tables 2, 3, 6 and 7. Table 5 gives accuracy on AIME24/25, AMC, OlympiadBench and MATH-500. ELKEN Table 6 reports Portability, Locality and Avg.'
  judge_model: 'Paper §4.1: ''we use Qwen2.5-72B-Instruct to assess whether the answers generated by the edited LLMs are semantically consistent'' and compute accuracy. GPT-4o is used only to convert events into triples. In the repo, Edit_RAG/edit_rag.py calls model ''Qwen2.5-72-Instruct''.'
  repro_level: Repo tree checked 2026-10-10. It has Edit_RAG/edit_rag.py and Edit_RAG/edit_rag_for_event.py (SCR plus LLM judge), EasyEdit/examples/run_LLM_evaluation.py(.sh) (editing methods with --evaluation_type LLM-judge on zsre/counterfact), and LUFFY/eval.sh plus LUFFY/eval_scripts/generate_vllm.py (math). Data is obtainable from KnowEdit HF, the ELKEN GitHub repo and LUFFY/data/*.parquet in the repo.
  notes: 'Repo files read 2026-10-10: Edit_RAG/edit_rag.py lines 108-124 (private base_url 172.30.36.55, Qwen2.5-72-Instruct); EasyEdit/easyeditor/evaluate/evaluate_utils.py lines 85-92 (api.deepseek.com, deepseek-chat). GitHub API reports license null. Paper footnote 2: ''This work extends [63]'' = arXiv:2503.05212.'
  scale.conversations: 'Not applicable: knowledge-editing items, not dialogues.'
  scale.avg_context_length: Not reported in the paper. The items are short QA prompts.
