  notes: 'The paper gives no size for the main evaluation set. Table 2 sequentially edits the full ZsRE and WikiData_counterfact sets. The editing-load analysis (Fig. 2: 1/10/100 edits) and the reasoning-LLM setting (Table 3) use the first 100 items of each dataset. The size of the ELKEN subset (future-trend questions removed) and of the math sets is not reported.'
