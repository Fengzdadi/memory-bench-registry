notes: OmniMemEval is an evaluation harness from MemTensor (Apache-2.0), not a new dataset. No paper was found on arXiv or by web search (checked 2026-10-10). The repo was created on 2026-06-24. It runs 14 memory backends through a common add()/search() adapter on existing benchmarks, plus OpenClaw/Hermes memory plugins on EvoAgentBench. Data is downloaded from upstream sources and keeps upstream licences, including CC BY-NC (LoCoMo) and CC BY-NC-ND (HaluMem). MemTensor, which makes MemOS, publishes the results, and MemOS is among the systems evaluated.
sources:
  name: repo README.md title and NOTICE ('OmniMemEval, Copyright 2026 MemTensor')
  release_date: 'null: no paper found (arXiv API search_query all:OmniMemEval returned 0 results; web search found no paper). For reference, GitHub API reports the repo created_at 2026-06-24 and the first commit on 2026-06-24.'
  venue: 'null: no paper and no arXiv listing; the README cites no venue or citation'
  memory_types: docs/user_memory/README.md lists LoCoMo, LongMemEval and BEAM (long multi-session dialogue recall -> conversational_longterm), PersonaMem v2 (preferences -> personalization) and HaluMem/LongMemEval knowledge-update/dynamic-update/conflict (-> semantic_knowledge_update). docs/user_memory/results.md reports the PersonaMem v2 Ask-to-Forget sub-score (1,048 Qs) and the Sensitive sub-score (-> memory_security). docs/agent_memory/README.md memory_train_backup_test protocol trains on the train split, backs up memory and restores it before the test split across 5 domains (-> procedural_workflow), including SWE-Bench (101/26) and LiveCodeBench (-> coding_cross_session).
  links.paper: 'null: no paper found'
  links.code: https://github.com/MemTensor/OmniMemEval (MemTensor org; gh api repos/MemTensor/OmniMemEval)
  links.data: 'null: no own dataset. The README says benchmark data is downloaded on demand from upstream sources (THIRD_PARTY_NOTICES.md); the HF search for OmniMemEval returned none.'
  scale.conversations: 'null: an aggregator with no single evaluation set'
  scale.questions: 'null: an aggregator. Per-benchmark counts are taken from docs/user_memory/results.md and data/*/README.md; train/test task counts are from the docs/agent_memory/README.md ''Dataset size'' table.'
  scale.notes: docs/user_memory/results.md (LoCoMo 1,540; LongMemEval 500; BEAM 400/200; PersonaMem v2 type counts sum to 5,000; HaluMem 3,467) and the docs/agent_memory/README.md Dataset size table (train 154+478+101+97+87=917, test 65+100+26+39+58=288)
  metrics: 'docs/user_memory/results.md Evaluation Setup table (primary metric and efficiency metric) and docs/agent_memory/results.md Metrics section (Acc, Avg turns, Avg chars); docs/agent_memory/README.md Results section (summary.json: pass@1, average reward)'
  judge_model: 'docs/user_memory/results.md Evaluation Setup: ''Judge model gpt-4o-mini-2024-07-18''; docs/agent_memory/results.md: ''Evaluation judge model: qwen3.6-flash in thinking mode''. No paper exists, so the official repo results are the source.'
  repro_level: 'Repo tree has scripts/run_locomo_eval.sh, run_lme_eval.sh, run_beam_eval.sh, run_pmv2_eval.sh, run_halumem_eval.sh (which call scripts/<bench>/*_eval.py and *_metric.py) plus scripts/run_agent_eval.sh and scripts/agentbench/run_agent_eval.py. Data comes via the data/*/prepare_*.py scripts. Checked 2026-10-10: the upstream HF datasets EverMind-AI/EvoAgentBench, xiaowu0162/longmemeval-cleaned, Mohammadta/BEAM, bowen-upenn/PersonaMem-v2 and IAAR-Shanghai/HaluMem are public and not gated, and the LoCoMo raw URL returns HTTP 200.'
  notes: README.md, THIRD_PARTY_NOTICES.md, docs/user_memory/README.md (14 solutions via 15 adapters), docs/agent_memory/results.md (OpenClaw 2026.5.7, Hermes v0.18.0), and the GitHub API created_at date
