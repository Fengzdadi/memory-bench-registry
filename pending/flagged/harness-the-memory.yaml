run_records: []
notes: This is an evaluation study, not a new dataset. It compares 11 memory substrates (M1-M11, including LoRA adapter tuning as the parametric substrate) on 3 backbones (Qwen3-8B, Qwen3-32B-AWQ, Gemma-4-26B-A4B-IT) using 26 metrics over existing benchmarks. The abstract says code will be released upon acceptance. As of 2026-10-10 no official repository was found, although the paper mentions a 'released code repository'. M9 is excluded on Gemma-4.
