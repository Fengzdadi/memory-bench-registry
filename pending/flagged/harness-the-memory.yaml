- Exact Match
- Token F1
- BLEU-1
- LLM Judge
- Compression Ratio
- Recall@k
- SubEM
- ALFWorld Task Success
- ALFWorld GC Success
- Steps to Goal
- BigCodeBench Pass@1
- Efficiency metrics E1-E15 (memory size, inference time, write/retrieval latency, write/read/management/total tokens and calls, total wall-clock, per-query latency)
judge_model: GPT-4o-mini
