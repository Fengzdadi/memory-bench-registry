  notes: There is no single main set; the paper reuses existing suites. LoCoMo has 10 dialogues and 1,986 questions. MemoryAgentBench AR uses LongMemEval-S* (300 queries, ~355K tokens each), alongside LRU, TTL and CR. CR is also swept at 6K/32K/262K tokens. ALFWorld has 134 valid-unseen tasks and BigCodeBench-Hard has 148 tasks.
