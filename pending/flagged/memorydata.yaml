notes: 'This is an evaluation study, not a new dataset. It runs 12 memory systems and 2 baselines on existing benchmarks: LoCoMo, LongMemEval, DB-Bench (from LifelongAgentBench) and LongBench. The repo (no licence file; checked 2026-10-10) bundles no data and has no DB-Bench loader. It adds MemBench, which the paper does not evaluate. The paper''s LoCoMo and LongBench subsets are not released. The paper uses a GPT-5.4 judge, but the repo''s LongMemEval judge script defaults to gpt-4o.'
sources:
  name: 'repo README title ''MemoryData: A Unified Memory Benchmark Suite for Memory-Augmented Agents''; paper title ''Are We Ready For An Agent-Native Memory System?'''
  release_date: 'arXiv API: 2606.24775v1 published 2026-06-23'
  venue: arXiv API shows no journal_ref; the comment lists only the paper-list and code links; README citation reads 'arXiv preprint arXiv:2606.24775'
  memory_types: 'paper (arXiv v1 HTML) §4.1 RQ1 setting: LoCoMo long-conversation QA and LongMemEval multi-session memory (conversational_longterm); DB-Bench ''evaluates whether memory supports procedural execution across database operations from LifelongAgentBench'', scored by EM and Task Success Rate, with Figure 7 results (procedural_workflow; LifelongAgentBench, arXiv 2505.11942, is a lifelong-learning stream of skill-grounded, interdependent tasks); §4.3 Table 2: LongMemEval Knowledge Update slice (semantic_knowledge_update)'
  links.paper: arXiv API id 2606.24775
  links.code: 'arXiv abstract and comment: ''The code is publicly available at https://github.com/OpenDataBox/MemoryData''; the repo homepage links back to arXiv'
  links.data: 'README FAQ: ''Datasets are not distributed here''; no official dataset page exists'
  scale.conversations: the paper (arXiv v1 HTML) has no dataset-size table; it states only '5 benchmark workloads, 11 datasets'
  scale.questions: not reported in the paper; repo config tags (Locomo_qa_4cat_600_dist.yaml, LongBench_rep150_proportional.yaml) hint at 600 and 150 items for the subsets
  scale.avg_context_length: not reported in the paper
  metrics: paper §4.1 (EM, Answer F1, Substring EM, ROUGE-L F1/Recall, LLM Judge Accuracy, Task Success Rate), §4.2 (Recall@K), §4.4 (LongBench Accuracy), §4.5 (Normalized Utility, latency metrics)
  judge_model: 'paper §4.1: ''GPT-5.4-based LLM Judge Accuracy from MemoryAgentBench''; repo evaluation/longmemeval/evaluate_longmemeval_judge.py defaults to --judge-model gpt-4o'
  repro_level: 'repo has the unified entry point main.py (--agent_config/--dataset_config), benchmark/*/loader.py with configs, and evaluation/longmemeval/evaluate_longmemeval_judge.py. Data comes from upstream sources: HF ai-hyz/MemoryAgentBench is public and not gated (parquet files listed), and the LoCoMo loader accepts the standard locomo10.json. The paper''s derived subsets and DB-Bench are not shipped (checked 2026-10-10)'
  notes: 'repo tree (gh api, not truncated, 3135 paths; re-checked 2026-10-10): benchmark/ has only locomo, longbench, membench, memoryagentbench, with no DB-Bench/LifelongAgentBench files; license null; paper mentions MemBench only in the references'
  scale.notes: repo config files benchmark/locomo/config/*.yaml, benchmark/longbench/config/LongBench_rep150_proportional.yaml, benchmark/memoryagentbench/**, benchmark/membench/config/*.yaml
