  notes: Paper cites 5 workloads and 11 datasets but gives no sizes. Repo configs name a LoCoMo '4cat_600_dist' subset and a 'Proportional 150-sample LongBench-v2 subset'; neither is released. Other configs cover MemoryAgentBench (EventQA, LongMemEval_s, FactConsolidation, ICL banking77) and five MemBench slices.
