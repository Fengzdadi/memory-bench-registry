  memory_types: 'paper §1/§3 (arXiv v2 HTML): evaluates appropriate use of stored user memories (cross-domain leakage, memory-induced sycophancy, beneficial memory use); memories given in system context, single-turn; leakage framed as appropriateness, explicitly contrasted with privacy/PII work, so memory_security not assigned'
