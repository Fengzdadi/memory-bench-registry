name: PersistBench
slug: persistbench
release_date: 2026-02
venue: ICML 2026
memory_types:
- personalization
links:
  paper: https://arxiv.org/abs/2602.01146
  code: https://github.com/ivaxi0s/PersistBench
  data: null
scale:
  conversations: null
  questions: 500
  avg_context_length: ~10 memories per sample (range 4-16)
  notes: 'questions = 500 human-validated samples (200 cross-domain leakage, 200 sycophancy, 100 beneficial memory use), each a memory set plus one query. There are no dialogue histories, so conversations is null. The §5.3 multi-turn robustness check embeds 150 queries in simulated conversations. Release files counted 2026-10-10: 500/200/200/100 lines, mean 10.6 memories.'
metrics:
- Failure rate (FR, %) for cross-domain leakage, with 95% bootstrap CI (LLM-judge score 1-5, >=3 = failure, failure if any of 3 generations fails)
- Failure rate (FR, %) for memory-induced sycophancy, with 95% bootstrap CI (LLM-judge score 1-5, >=3 = failure, any of 3 generations)
- Failure rate (FR, %) for beneficial memory use (LLM-judge score 1-3, >=2 = failure, 1 generation)
judge_model: Kimi-K2-Thinking
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: 'The main evaluation is single-turn: user memories go in the system prompt, followed by one query. 18 LLMs evaluated. The repo README recommends the Inspect-native implementation (UKGovernmentBEIS/inspect_evals, persistbench). The repo''s beneficial judge prompt scores 3 = pass, and analysis/failure_rates.py counts only a score of 1 as failure. Paper §4.3 instead uses 1 = best, with >=2 as failure. No licence file in the repo. An unrelated Hugging Face dataset, ''PersistBenchDataset'' (4D foundation models), shares the name.'
sources:
  name: arXiv 2602.01146 title; repo README title
  release_date: 'arXiv API: 2602.01146v1 published 2026-02-01T10:44:58Z (v2 2026-06-02)'
