name: CAME-Bench
slug: came-bench
release_date: 2026-01
venue: Findings of ACL 2026
memory_types:
- conversational_longterm
- semantic_knowledge_update
links:
  paper: https://arxiv.org/abs/2601.10702
  code: https://github.com/Seattleyrz/contextual-intent
  data: https://huggingface.co/datasets/Seattleyrz/CAME-Bench
scale:
  conversations: 14
  questions: 373
  avg_context_length: 23k / 137k / 408k tokens (S / M / L subset averages)
  notes: 14 = goal-oriented trajectories (Travel Planning user-assistant dialogues and two-agent Debate), split S 6 / M 6 / L 2; 373 = free-response questions, S 144 / M 168 / L 61, of four types (memory revision, context-aware recall, multi-hop, synthesis). No overall average length reported; figures are per-subset averages. Paper also evaluates on subsampled LongMemEval (N=50/50/15).
metrics:
- answer-set macro-averaged precision
- answer-set macro-averaged recall
- answer-set macro-averaged F1
judge_model: gpt-4.1-mini
repro_level: official_script
repro_checked_at: '2026-10-10'
run_records: []
notes: 'Introduced alongside the STITCH memory method. The full benchmark on Hugging Face (MIT, not gated) is XOR/Base64-encoded against contamination and must be decoded with the bundled codec.py; example_data/ holds only a decoded sample for the viewer. Evaluation is retrieval-centric: the method''s retrieved context (capped at 4,096 tokens) is fed to a fixed generator (gpt-5-mini in the paper), then judged. Paper-result scripts are on the repo''s paper-exp branch. arXiv comment says "ACL 2026"; ACL Anthology lists it in Findings.'
