  notes: '602 tasks, each paired with one multi-day user-assistant dialogue history: OdysseyBench+ 300 (93 single-app, 95 two-app, 112 three-app) and OdysseyBench-Neo 302 (60/71/171). Average sessions per conversation: 27.9 (Plus) vs 5.0 (Neo). The repo tree on 2026-10-10 held 300 subtasks_plus and 302 subtasks_neo task files.'
