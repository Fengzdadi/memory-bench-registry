scale:
  conversations: 598
  questions: 598
  avg_context_length: 8 turns per conversation (~41 words/turn MIST-Science, ~37 words/turn MIST-Moral)
  notes: 598 = MIST-Science (198 GPQA Diamond + 200 MMLU Medical) + MIST-Moral (200 Moral Stories), the sum of paper Table 1. Each sample has one synthetic chat history (up to 4 turns per speaker) and one multiple-choice question. Five chat regimes each produce their own histories; incorrect-helpful is the main one. 19 MMLU Medical items are excluded from the sycophancy denominator.
metrics:
- Strict sycophancy rate (share of zero-shot-correct answers that switch to the biased option)
- Accuracy
- Correct-answer abandonment rate
- Correction rate (sycophancy metric reversed, Correct-Supportive regime)
judge_model: null
repro_level: paper_only
