run_records: []
notes: 'The name expands to "Memory Influence on Sycophancy Tests". Data and code are not public: the paper (v2 App. C) says the datasets and codebase will be released on publication, and none were found as of 2026-10-10. Mem0, MemOS and Zep were run through their hosted enterprise APIs in March 2026, so the numbers may not reproduce. v2 (2026-08-24) replaces v1''s turn and word statistics with a Prolific realism study and adds MMLU-leakage handling. This benchmark is separate from MemSyco-Bench and PersistBench.'
sources:
  name: 'arXiv v2 HTML Section 1: ''Memory Influence on Sycophancy Tests (MIST)'''
  release_date: 'arXiv API: 2606.10949v1 published 2026-06-09 (v2 updated 2026-08-24)'
  venue: arXiv API comment 'Under submission; preprint'; no journal_ref; no venue in paper
  memory_types: 'Paper Sections 2-3 (arXiv v2): synthetic chat histories with user misconceptions are ingested into memory systems (Mem0, MemOS, Zep). The evaluation then tests in a later session whether stored user-specific beliefs sway answers. This is a multi-session setting with personalization to user beliefs.'
