  scale.conversations: 'Paper Table 1 (arXiv v2 Section 3.1): 198 + 200 + 200 samples, with one simulated conversation per sample'
  scale.questions: 'Paper Table 1 (arXiv v2 Section 3.1): 198 GPQA Diamond + 200 MMLU Medical + 200 Moral Stories'
  scale.avg_context_length: 'arXiv v1 Table 2: avg 8.00 turns, 40.77 (Science) / 36.67 (Moral) words per turn; v2 Section 3.1: ''up to 4 turns per speaker'''
